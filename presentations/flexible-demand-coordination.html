<h2 id="the-grid-has-two-problems-and-they-need-two-different-signals">The grid has two problems, and they need two different signals</h2>
<ul>
<li><strong>Balancing the grid is economics.</strong> The answer is a highly dynamic price. That is the right answer to problem 1, and where a jurisdiction is moving toward it, it should be pursued harder, not hedged.</li>
<li><strong>Protecting the wire to one house is physics.</strong> The answer is a per-customer power limit on the whole service connection, import and export.</li>
<li><strong>Price reduces capacity problems. It cannot eliminate them</strong>, because the price is a system-wide number and the constraint is on one street.</li>
</ul>
<div class="band">
<p>Separable in policy and in technology. They meet in exactly one place: <strong>the thing in the house that decides what runs.</strong></p>
</div>

<h2 id="the-two-signals-as-objects-on-the-wire">The two signals, as objects on the wire</h2>
<table>
<thead>
<tr>
<th></th>
<th>A dynamic price</th>
<th>A per-customer power limit</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>What it is</strong></td>
<td>What power costs now, and over the coming hours</td>
<td>How much power this connection may draw, import and export</td>
</tr>
<tr>
<td><strong>Unit</strong></td>
<td>The whole system</td>
<td>One service connection</td>
</tr>
<tr>
<td><strong>The instrument</strong></td>
<td>A tariff. It prices energy</td>
<td>A condition on the service connection. It prices nothing</td>
</tr>
<tr>
<td><strong>Shape on the wire</strong></td>
<td>An interval: start, duration, typed value</td>
<td><strong>An interval: start, duration, typed value</strong></td>
</tr>
<tr>
<td><strong>Horizon</strong></td>
<td>Hours ahead, advisory</td>
<td>Hours ahead advisory, binding at the moment it applies</td>
</tr>
<tr>
<td><strong>Who may originate it</strong></td>
<td>A seller of electricity, an aggregator, or the house itself</td>
<td>The distribution operator, for that connection only</td>
</tr>
<tr>
<td><strong>Who enforces it</strong></td>
<td>Nothing. The house decides</td>
<td>A UL 3141 listed power control system</td>
</tr>
<tr>
<td><strong>Failure mode</strong></td>
<td>Somebody loses money</td>
<td>Somebody's transformer fails</td>
</tr>
<tr>
<td><strong>Trust model</strong></td>
<td>A public number anyone may read</td>
<td>A per-customer value, authenticated, enforced locally</td>
</tr>
</tbody>
</table>
<div class="cap">
<p><strong>Same shape on the wire is why this is one protocol problem and not two. Different failure modes are why it is still two signals</strong>, which cannot share a trust model or an enforcement point.</p>
<p><strong>A time-of-use rate is a price stream with fewer changes. A flat rate is one with none.</strong> Same mechanism, same appliance, whatever tariff the customer is on. <strong>The appliance never needs a tariff engine, only an interval consumer.</strong></p>
</div>

<h3 id="the-second-signal-inside-the-house">The second signal, inside the house</h3>
<h2 id="only-two-things-in-the-house-need-to-know-the-limit">Only two things in the house need to know the limit</h2>
<blockquote>
<p>Everything gets the price. Two things get the limit. One thing enforces it.</p>
</blockquote>
<ul>
<li><strong>The UL 3141 listed power control system that enforces it.</strong> Enforcement has to happen where the whole site's draw is visible. <strong>A leaf node cannot enforce a site limit, because it cannot see the site.</strong> NEC 705.13.</li>
<li><strong>The energy manager that plans against it</strong>, so the house schedules inside the envelope instead of colliding with it. The forward view is what lets it pre-heat the tank and stage the car rather than be surprised.</li>
<li><strong>They can be the same device.</strong></li>
<li><strong>No other appliance needs to know the limit exists.</strong> Which collapses the whole appliance question into one: <strong>can the price reach it?</strong> <strong>An appliance should be able to do either</strong>: receive the price and decide for itself, or take a schedule from something in the house that has the price. <strong>What fails is the manufacturer's cloud as the only path.</strong></li>
</ul>
<div class="band">
<p><strong>It must survive the network.</strong> A house holding today's prices and today's limit keeps behaving correctly with no connection at all.</p>
</div>

<h3 id="how-a-signal-reaches-an-appliance-today">How a signal reaches an appliance today</h3>
<h2 id="the-path-that-exists-and-what-it-costs">The path that exists, and what it costs</h2>
<div class="columns" style="grid-template-columns: 1fr 1.25fr">
<div>
<ul>
<li><strong>Coordination runs through the manufacturer.</strong> The customer cannot centrally manage devices from three manufacturers, cannot reach the power and energy APIs of equipment they own, and cannot coordinate anything with the Internet down, which is exactly when local coordination matters most.</li>
<li><strong>It can be switched off.</strong> On <strong>October 25, 2025</strong> Google ended cloud support for first and second generation Nest thermostats. Those homes lost every ability to respond to an outside signal, on a date the manufacturer chose.</li>
<li><strong>Aggregators are legitimate, they do real work, and they should be fully supported.</strong> <strong>They must never be the only door.</strong></li>
</ul>
</div>
<div>
<p><img src="images/cpuc/today-compact.svg" alt="" style="width:560px;" /></p>
<div class="cap">
<p>Every arrow is a commercial agreement somebody has to sign, maintain and renew, and it gets worse each time a household electrifies one more thing.</p>
</div>
</div>
</div>

<table>

</tr>

<td>Unchanged</td>
</tr>
<tr>

<td>Unchanged</td>
</tr>

<td>Unchanged</td>
</tr>
<tr>
<td><strong>Distribution: per-device control</strong></td>
<td>Not available at scale. Pilots</td>
<td>Unchanged</td>
</tr>

<h2 id="two-facts-two-boundaries-two-protocols">Two facts, two boundaries, two protocols</h2>
<blockquote>
<p><strong>The count of protocols should follow the count of boundaries, not the count of appliance categories.</strong></p>
</blockquote>
<table>
<thead>
<tr>
<th>Boundary</th>
<th>What has to cross it</th>
<th>The standard</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Grid to house</strong>, over the Internet</td>
<td>The price with a forward schedule, and the connection limit</td>
<td><strong>OpenADR 3</strong></td>
</tr>
<tr>
<td><strong>House to devices</strong>, over the home network</td>
<td>The same two facts, to everything in the building</td>
<td><strong>Matter</strong></td>
</tr>
<tr>
<td><strong>At the service connection</strong></td>
<td>Enforcement of the limit</td>
<td><strong>UL 3141</strong> listed PCS, NEC 705.13</td>
</tr>
</tbody>
</table>
<div class="band">
<p><strong>Any given appliance speaks exactly two protocols: one to the grid, one inside the house.</strong> Every appliance in the house is wired to one electrical code, and nobody wrote a separate code for water heaters. <strong>The signals that tell them what to do should arrive the same way. Nothing speaks four, and nothing needs a protocol named after itself.</strong></p>
</div>
<div class="cap">
<p><strong>This is less regulation, not more:</strong> one capability written once, instead of a rulemaking per appliance forever, each going stale the day it is printed.</p>
</div>
<footer>grid-coordination.energy<span class="who">DC Jackson</span></footer>
</section>

<h3 id="the-other-boundary">The other boundary</h3>
<h2 id="inside-the-house-commands-are-fine">Inside the house, commands are fine</h2>
<blockquote>
<p><strong>Across the grid boundary, objectives only. Inside the house the manager may command, because the customer owns it.</strong></p>
</blockquote>
<ul>
<li><strong>The appliance says what it plans to do, and the manager reshapes the plan.</strong> Start later, draw less, pause, resume. This is Matter's Device Energy Management, <strong>a cluster that exists in the specification today.</strong></li>
<li><strong>Every adjustment records who asked for it</strong>, the house or the grid, and the record travels with the command.</li>
<li><strong>So the customer can refuse the grid and keep local optimization.</strong> No cloud-mediated program offers that choice.</li>
<li><strong>And that setting cannot be changed over the network.</strong> It changes on the device, by the person who owns it.</li>
</ul>
<div class="band">
<p><strong>One data model spans the whole house.</strong> It already types EV charging equipment, water heating, space heating and cooling, battery storage, solar PV and pool pumps: <strong>every appliance category California is writing a separate rule for.</strong></p>
</div>
<footer>grid-coordination.energy<span class="who">DC Jackson</span></footer>

<h3 id="the-same-split-specified-independently">The same split, specified independently</h3>
<h2 id="two-interfaces-already-specified">Two interfaces, already specified</h2>
<p><img src="images/cpuc/two-interfaces.svg" alt="" style="width:940px;" /></p>
<div class="cap">
<p>The architecture of the <strong>OpenADR 3 to Matter interworking reference specification</strong>, published by geo in March 2025, sponsored by the UK Department of Energy Security and Net Zero and developed with OpenADR Alliance and Connectivity Standards Alliance <strong>experts</strong>. It is not an alliance work product: the specification recommends that a standards body adopt it. <strong>The OpenADR Alliance and the Connectivity Standards Alliance have since entered a liaison agreement, which came after this work rather than producing it.</strong></p>
</div>
<blockquote>
<p><strong>Somebody else already wrote this architecture down. What is missing is not the specification. It is the requirement.</strong></p>

<h3 id="interface-a-over-the-internet">Interface A, over the Internet</h3>
<h2 id="openadr-3-at-the-grid-boundary">OpenADR 3 at the grid boundary</h2>
<ul>
<li><strong>It carries both facts.</strong> A price with a forward schedule and a per-customer import and export limit are the same object. <strong>The limit is a payload type, not a new protocol.</strong></li>
<li><strong>It is ordinary web technology.</strong> HTTPS and TLS, JSON, OAuth 2 for authorization, MQTT for server-initiated push so a client behind a home router never has to poll.</li>
<li><strong>It runs on hardware appliances already contain.</strong> A full client has been implemented on an <strong>ESP32 with integrated Wi-Fi, under $5 in quantity.</strong> The customer already paid for that part.</li>
<li><strong>The server address is a setting.</strong> The same protocol reaches a manufacturer's server, a seller of electricity, an aggregator, or a server in the customer's own house. Nothing above it changes.</li>
<li><strong>It is the only one of these standards designed for the utility-to-customer leg.</strong></li>
</ul>
<div class="cap">
<p>I proposed and led the OpenADR Alliance working group that produced the push notification protocol adopted in 3.1.</p>
</div>
<footer>grid-coordination.energy<span class="who">DC Jackson</span></footer>

<h2 id="one-object-two-payload-types">One object, two payload types</h2>
<div class="cap" style="margin-top:0">
<p><strong>Two OpenADR 3 event intervals. Same schema, same client, same parser.</strong></p>
</div>

<td>one hour</td>

<blockquote>
<p><strong>One field differs. Everything else is the same object.</strong></p>
</blockquote>
<ul>
<li><strong>A client written for one is already a client for the other.</strong> No second stack, no second certification, no second rulemaking.</li>
<li>The registry also carries <strong>EXPORT_CAPACITY_LIMIT</strong>, the available and reservation capacity types, and pass-through types for CTA-2045.</li>
<li><strong>This is what &quot;one protocol crosses the grid boundary&quot; actually means.</strong> Not a claim about vendors. A claim about a schema.</li>

<h3 id="openadr-310-user-guide-section-810-capacity-management">OpenADR 3.1.0 User Guide, section 8.10 Capacity Management</h3>
<h2 id="the-standard-is-ready-nobody-is-sending-it">The standard is ready. Nobody is sending it.</h2>
<div class="band">
<p><strong>IMPORT_CAPACITY_LIMIT</strong>, verbatim from the event interval payload registry: &quot;The maximum import level for <strong>the site</strong>.&quot; <strong>The site is the whole service connection, not one inverter.</strong></p>
</div>
<table>
<thead>
<tr>
<th>In the specification today</th>
<th>What it says</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>8.10.1 Dynamic Operating Envelopes</strong></td>
<td>A schedule of site-level import and export capacity in kW, announced when a client connects. Intervals commonly days long, re-announceable at any time. CSIP-AUS is the cited precedent</td>
</tr>
<tr>
<td><strong>8.10.2 Dynamic Capacity Management</strong></td>
<td>A subscription, plus increases the customer can buy. The customer bids a reservation and a fee; the server publishes what is available and at what price</td>
</tr>
<tr>
<td><strong>Communications loss, and outage</strong></td>
<td>The client reverts to <code>IMPORT_CAPACITY_SUBSCRIPTION</code>, announced with an interval that could be years long. After a grid outage it disregards every existing limit and re-polls</td>
</tr>
</tbody>
</table>
<div class="cap">
<p>Section 8.10.2, drawing the same line this deck draws. &quot;Because the capacity information is customer-specific, this is a program requiring authentication, not a tariff relationship as the underlying energy prices are for the same customer.&quot;</p>
</div>
<div class="ask">
<p>This has been in the standard since 3.1.0. Nothing needs to be invented. <strong>What does not exist is any utility sending that envelope to a residential customer's own equipment.</strong></p>
</div>
<footer>grid-coordination.energy<span class="who">DC Jackson</span></footer>

<div class="cap">
<p>● full. ○ partial, <strong>and the tag says which kind</strong>: <em>home</em>, works only once something in the house already has the signal. <em>spec</em>, in the specification, not offered to residential customers in the US. <em>unit</em>, it carries a limit, but not for the service connection. <em>socket</em>, it reaches the appliance, but only through a separately purchased module that speaks a proprietary protocol upstream. <em>unimplemented</em>, the standard permits it and no product implements it.</p>
<p><strong>Matter is local by construction</strong>, so its mark on reaching the appliance is structural: a product that supports Matter supports it on the home network, because there is no cloud-mediated Matter. <strong>AHRI 1380 permits exactly the same thing and no appliance implements it</strong>, which is what the tag says.</p>
<p><strong>The blanks are deliberate.</strong> Matter has no site object, so there is nothing in the data model to hold a connection limit. CTA-2045 and AHRI 1380 terminate in a vendor cloud, so with the Internet down nothing new arrives and no address is configurable.</p>
<p><strong>Enforcement is not a row on this table, because no protocol enforces a limit.</strong> A UL 3141 listed power control system does. And four of these six were built to manage exactly one piece of equipment: an inverter, an appliance, an HVAC system, a charger. <strong>A modern house has all four.</strong></p>
</div>

<h3 id="ieee-20305">IEEE 2030.5</h3>
<h2 id="built-to-control-inverters-not-to-manage-a-house">Built to control inverters, not to manage a house</h2>
<div class="cap" style="margin-top:0">
<p><strong>Credit where it is due.</strong> The usual smart inverter protocol: <strong>California Rule 21 names it the default</strong>, not the only one. SunSpec certifies implementations through authorized labs, and it does real distributed energy resource control.</p>
</div>
<ul>
<li><strong>The unit is one inverter.</strong> A modern house has solar, a battery and one or two bidirectional chargers. Control each separately and <strong>nobody is managing the total.</strong></li>
<li><strong>CSIP does express export limits at a point of common coupling.</strong> The unit available there is the inverter or the aggregate of inverters. <strong>It is not the whole service connection including load</strong>, which is what a transformer actually sees.</li>
<li><strong>In US residential practice the customer is not in the path.</strong> Manufacturers translate 2030.5 into proprietary commands or proxy it to their own client. No seller of electricity offers one a direct connection to its 2030.5 server.</li>
<li><strong>And the identity model is why.</strong> Every client needs an X.509 certificate the utility's PKI will accept. Reasonable for an inverter the utility answers for. <strong>It structurally excludes a customer running their own client, or an open-source one.</strong></li>
</ul>
<blockquote>
<p><strong>OpenADR 3 uses TLS with OAuth 2 client credentials, which is how a bank exposes your account to software you chose. Good enough to move money is good enough for a price and a limit.</strong></p>
</blockquote>
<footer>grid-coordination.energy<span class="who">DC Jackson</span></footer>

<h3 id="ocpp">OCPP</h3>
<h2 id="built-for-public-charging-not-for-the-home">Built for public charging, not for the home</h2>
<ul>
<li><strong>It does public charging very well</strong>, which is what it was designed for. It also specifies a great deal that a charger in a garage has no use for.</li>
<li><strong>Almost no US residential chargers implement it.</strong> Where it is supported, the connection is not offered to the customer: <strong>it points at the vendor's cloud.</strong></li>
<li><strong>What it does carry is aimed somewhere else.</strong> Charging profiles impose a limit on the charger, not on the connection. Tariff and cost messages exist to show a driver a number, not to let a load plan against a schedule.</li>
<li><strong>There is no need for a protocol unique to EV chargers.</strong> A charger needs the same two facts as the water heater next to it.</li>
</ul>
<div class="band">
<p><strong>A charger rule is the rule most likely to name a charger-specific protocol</strong>, for no better reason than that it is a charger rule. <strong>CEC docket 24-FDAS-04 is open, no rule text yet, and there is no residential installed base to grandfather. Nothing is lost by leaving OCPP out.</strong></p>
</div>

<h3 id="mandated-on-new-electric-water-heaters-in-four-us-states-wa-or-co-and-ny">Mandated on new electric water heaters in four US states: WA, OR, CO and NY</h3>
<h2 id="cta-2045-marketed-as-ecoport-the-open-interface-stops-at-the-socket">CTA-2045, marketed as EcoPort: the open interface stops at the socket</h2>
<div class="columns">
<div>
<div class="columns">
<div>
<p><img src="images/DRP-UCM-SGD.png" alt="" style="height:286px;" /></p>
</div>
<div>
<p><img src="images/DRP-OA3-SGD.png" alt="" style="height:286px;" /></p>
</div>
</div>
<div class="cap">
<p><strong>Same appliance. Same DR provider. One of them has a $150 part, a proprietary link and an install visit.</strong></p>
</div>
</div>
<div>
<ul>
<li><strong>The socket is standardized. Nothing above it is.</strong> Every vendor's module speaks its own language upstream, so two compliant water heaters need not interoperate, and neither is reachable by anyone but its module's vendor.</li>
<li><strong>The module costs well over $150</strong>, and the customer has to buy it, install it and configure it to Wi-Fi. In practice that has proven insurmountable.</li>
<li><strong>It cannot carry a price.</strong></li>
<li><strong>Its semantics are already expressible in OpenADR 3</strong>, delivered to the appliance directly. <strong>Nothing of consequence is lost by retiring it</strong>, and the alliance is writing the mapping.</li>
</ul>
</div>
</div>
<div class="band">
<p><strong>Worse than neutral: mandating the port consumes the appliance's device-communications budget and precludes the better solution.</strong></p>
</div>

<h3 id="section-622-in-the-standards-own-words-two-loopholes-in-three-lines">Section 6.2.2, in the standard's own words: two loopholes in three lines</h3>
<h2 id="ahri-1380-the-interface-may-live-anywhere-so-it-lives-in-a-cloud">AHRI 1380: the interface may live anywhere, so it lives in a cloud</h2>
<p><img src="images/1380-2019-Networking.png" alt="" style="width:860px;" /></p>
<ul>
<li><strong>&quot;shall include one or more of the following interfaces.&quot;</strong> One is enough, so one is what ships.</li>
<li><strong>&quot;Location of the interface can reside within any of the required system architecture.&quot;</strong> So the interface may live in the manufacturer's cloud, and it does. <strong>It certifies the cloud, not the appliance.</strong></li>
<li>The standard permits a local interface two ways: an OpenADR 2.0 connection over Ethernet or Wi-Fi, or a CTA-2045-A port. <strong>In seven years no shipping product has implemented either on the equipment, and I know of no vendor planning to. At some point that stops being a lag and becomes a choice.</strong></li>
</ul>

<h2 id="what-actually-happens-when-the-appliance-is-unboxed">What actually happens when the appliance is unboxed</h2>
<ul>
<li><strong>Default, with no customer action at all:</strong> the appliance ships with the manufacturer's server address preconfigured, joins the network, connects, and participates. <strong>Out of the box it works, and nobody has to understand any of this.</strong></li>
<li><strong>Before falling back to that default, it looks for a local energy manager over mDNS.</strong> If one answers, it uses that instead. <strong>A customer who owns an energy manager gets local coordination with zero configuration.</strong></li>
<li><strong>At any time the customer can point it somewhere else:</strong> their seller of electricity, an aggregator they chose, or their own energy manager. <strong>One setting. One URL.</strong></li>
<li><strong>One gap, and it is small.</strong> OpenADR 3.1 defines local discovery: the service type <code>_openadr3._tcp.</code>, with <code>local_url</code>, <code>base_path</code>, <code>program_names</code> and <code>requires_auth</code> in the TXT record. <strong>Every clause of it is a SHOULD.</strong> A rule that expects an appliance to find a local energy manager has to say SHALL. <strong>That is a one-word specification ask, not a rulemaking ask, and I will carry it.</strong></li>
</ul>

<h3 id="all-of-ethernet-wi-fi-and-cellular-not-one-or-more-of">All of Ethernet, Wi-Fi and cellular. Not one or more of.</h3>
<h2 id="network-interfaces-the-requirement-that-keeps-getting-softened">Network interfaces: the requirement that keeps getting softened</h2>
<div class="ask">
<p><strong>&quot;Must support Ethernet, Wi-Fi and cellular&quot; is not a cost objection. It is a $5 objection.</strong></p>
</div>
<div class="columns">
<div>
<ul>
<li><strong>A garage with no usable Wi-Fi:</strong> the customer, the installer or the DR provider adds a cellular dongle. <strong>$39.99.</strong></li>
<li><strong>A customer who wants wired reliability:</strong> a USB-C to Gigabit Ethernet adapter. <strong>$4.76.</strong></li>
<li><strong>Write it so a vendor cannot satisfy it with a promise:</strong> at least one integrated network interface, <strong>plus a USB-C host port that accepts a class-compliant network adapter</strong>. That is testable. &quot;Capable of supporting&quot; on its own is not.</li>
<li><strong>AHRI 1380 is the worked example.</strong> It says &quot;one or more of the following interfaces,&quot; and what ships is one.</li>
</ul>
</div>
<div>
<p><img src="images/Cheap-ethernet-dongle.png" alt="" style="width:540px;" /></p>
</div>
</div>
<div class="band">
<p><strong>Write &quot;all three, integrated or over USB-C.&quot; Do not write &quot;one or more of.&quot;</strong></p>
</div>
<footer>grid-coordination.energy<span class="who">DC Jackson</span></footer>

<h3 id="the-energy-manager">The energy manager</h3>
<h2 id="the-local-price">The local price</h2>
<div class="cap" style="margin-top:0">
<p>An energy manager receives the grid price over OpenADR 3, then does one of two things.</p>
</div>
<ul>
<li><strong>Republishes it unchanged</strong>, to every device in the house, over Matter.</li>
<li><strong>Computes a local price</strong> from the grid price, what the roof is generating right now, and what is stored in the battery and the cars. <strong>The dishwasher then sees the true marginal cost of running in this house at this minute</strong>, which is not the grid price and never was.</li>
</ul>
<div class="band">
<p>This is why the translation belongs in the house. <strong>Only the house knows the car is already charged, that nobody is home, and that the battery is full.</strong> No aggregator can compute this number, because no aggregator has the inputs.</p>
<p><strong>And the privacy comes free, instead of costing something.</strong> Send a number instead of a command and the most intimate data in the house never leaves it.</p>
</div>
<div class="ask">
<p><strong>And it is the same interface either way.</strong> The appliance sees an interval-valued price. It never knows or cares who computed it.</p>
</div>

<h3 id="the-same-argument-one-layer-up">The same argument, one layer up</h3>
<h2 id="one-standard-not-one-per-appliance">One standard, not one per appliance</h2>
<div class="cap" style="margin-top:0">
<p><strong>The first flexible demand appliance standard in the US is California's</strong>, Title 20 sections 1690 to 1697, pool controls, in force for units built on or after September 29, 2025. <strong>It is also the worked example of how not to do this.</strong></p>
</div>
<table>
<thead>
<tr>
<th></th>
<th></th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>What it requires</strong></td>
<td>A preconfigured schedule: run 9 a.m. to 3 p.m., never automatically 4 p.m. to 9 p.m. (1693(b)(2)(C)(1)). Open standards for the <strong>consent</strong> functions only (1693(b)(6)(B))</td>
</tr>
<tr>
<td><strong>What it cannot do</strong></td>
<td>Receive a price. Receive a limit. Receive anything at all, over any open protocol, from anybody the customer chooses</td>
</tr>
<tr>
<td><strong>Written the same way now</strong></td>
<td>Thermostats (24-FDAS-03), EV charging equipment (24-FDAS-04), home batteries (25-FDAS-01). Then water heaters, then whatever is next</td>
</tr>
</tbody>
</table>
<div class="band">
<p><strong>Written one appliance at a time, the first one produced a clock.</strong> An appliance built to it cannot receive a price, cannot respect a limit, and cannot be pointed at a server the customer chose. <strong>It is the opposite of every principle in this deck, and it is the template for the next three rules unless something changes.</strong></p>
</div>
<div class="ask">
<p><strong>One standard, for every flexible demand appliance, stating the capability.</strong> An appliance appendix only where the physics genuinely differs. <strong>This is less regulation, not more.</strong></p>
</div>

<h2 id="write-the-capability-not-the-standard">Write the capability, not the standard</h2>
<table>
<thead>
<tr>
<th>Write this, in the rule</th>
<th>Not this</th>
</tr>
</thead>
<tbody>
<tr>
<td>The appliance shall receive a price with a forward schedule and a connection limit over an open protocol, implemented in the appliance</td>
<td>&quot;Shall support [named standard, 2019 edition]&quot;</td>
</tr>
<tr>
<td>The server address shall be configurable by the owner without the manufacturer's participation</td>
<td>&quot;The manufacturer shall provide a grid interface&quot;</td>
</tr>
<tr>
<td>The appliance shall retain and act on the last received values with no network connection</td>
<td>Nothing, which is what most rules say about outages</td>
</tr>
<tr>
<td>At least one integrated network interface, plus a USB-C host port accepting a class-compliant network adapter</td>
<td>&quot;One or more network interfaces&quot;</td>
</tr>
<tr>
<td>A customer may take the signals directly, with no enrollment and no intermediary</td>
<td>&quot;Customers participate through a program administrator&quot;</td>
</tr>
<tr>
<td>One import and export limit for the service connection, enforced by a listed power control system</td>
<td>&quot;Each inverter shall be controllable&quot;</td>
</tr>
</tbody>
</table>
<div class="cap">
<p><strong>Name the standard in an appendix you can update without reopening the rule.</strong> The rule states the performance requirement <strong>and its test method</strong>. The appendix lists the protocols staff have found to conform to that test method. <strong>A new protocol is added by demonstrating conformance, not by reopening the requirement.</strong></p>
</div>

<h2 id="the-same-rule-text-as-bench-tests">The same rule text, as bench tests</h2>
<div class="cap" style="margin-top:0">
<p><strong>A capability nobody can test is a capability nobody will adopt.</strong> Appliance rules run on test methods, California's Title 20 included. <strong>Each line is measurable on a bench in an afternoon, with no help from the manufacturer.</strong></p>

<tbody>
<tr>

</tr>
<tr>
<td><strong>Customer-configurable server</strong></td>

</tr>
<tr>
<td><strong>Both facts consumed</strong></td>

</tr>
<tr>
<td><strong>Local survival</strong></td>

</tr>
<tr>
<td><strong>All three interfaces</strong></td>

</tr>
<tr>
<td><strong>No enrollment</strong></td>
<td>Connect the appliance to a reference server with no account creation, no program enrollment and no intermediary. It receives and acts on both facts</td>
</tr>
<tr>

<h2 id="the-asks">The asks</h2>
<div class="cap" style="margin-top:0">
<p><strong>Wherever appliance rules are open, the protocol count goes to two or to ten.</strong> California has three open with no rule text: thermostats (24-FDAS-03), EV charging equipment (24-FDAS-04), home batteries (25-FDAS-01).</p>
</div>
<ul>
<li><strong>One flexible demand standard, not one per appliance.</strong> State the capability once, for every appliance in scope.</li>
<li><strong>Write the capability, not the clock, and not the protocol name.</strong> The two facts, an open interface in the appliance, a configurable server address, local retention. Standards in an appendix, tied to a test method.</li>
<li><strong>Do not accept a cloud interface as compliance.</strong> AHRI 1380-2019 is the worked example: permitted locally, implemented by nobody.</li>
<li><strong>Do not write a per-appliance protocol into a per-appliance rule.</strong> No OCPP in the EVSE standard, no CTA-2045 in the water heater standard.</li>
<li><strong>Say what happens to the limit.</strong> Where a flexible service connection is ordered (D.26-02-025), the limit must reach the customer's own equipment in an open, machine-readable form, with no enrollment and no intermediary.</li>
<li><strong>A signal nothing can find is not a signal.</strong> California's hourly rate is due January 1, 2027; the tool that lets a device discover which rate a customer is on, not until May 8, 2029.</li>
</ul>

<h2 id="where-california-actually-stands">Where California actually stands</h2>
<table>
<thead>

<th>Driver</th>

<tbody>
<tr>
<td><strong>Load Management Standards</strong></td>
<td>Large IOUs: an hourly, marginal cost-based rate for every customer class by <strong>January 1, 2027</strong>. Large CCAs: that rate or a qualifying program by <strong>July 1, 2027</strong>. The joint rate identification access tool has slipped to <strong>May 8, 2029</strong></td>
</tr>
<tr>
<td><strong>Flexible service connections</strong></td>
<td><strong>D.26-02-025</strong>, February 2026. PG&amp;E and SCE to establish a standardized tariffed flexible connection. Load behind a <strong>UL 3141 certified</strong> power control system is excluded from the connected load calculation</td>
</tr>

<h2 id="commercial-and-grid-scale-how-is-this-communicated-today">Commercial and grid-scale: how is this communicated today?</h2>
<table>
<thead>
<tr>
<th>Function</th>
<th>Commercial and grid-scale</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Highly dynamic prices</strong></td>
<td>Thin. Price servers exist, MIDAS in California. Neither is a path an appliance can rely on</td>
</tr>
<tr>
<td><strong>Demand response events</strong></td>
<td>OpenADR 2.0b, cloud to cloud. Some IEEE 2030.5</td>
</tr>
<tr>
<td><strong>Functional control of devices</strong></td>
<td>IEEE 2030.5, <strong>inverters only</strong></td>
</tr>
<tr>
<td><strong>Grid alerts</strong></td>
<td>No machine path</td>
</tr>
<tr>
<td><strong>Distribution: per-device control</strong></td>
<td>IEEE 2030.5, <strong>inverters only</strong></td>
</tr>
<tr>
<td><strong>Distribution: per-site control</strong></td>
<td>Thin. IEEE 2030.5 where it exists at all</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>This is the answer to &quot;why not just use what commercial and grid-scale already use.&quot;</strong> The one solid entry is inverters, the unit of management is wrong for a house, and 2.0b is a cloud-to-cloud protocol that was never meant to reach an appliance.</p>
</blockquote>

<h2 id="openadr-3-on-the-wire">OpenADR 3 on the wire</h2>
<ul>
<li><strong>Objects:</strong> programs, events with intervals, reports. An interval has a start, a duration and a typed value.</li>
<li><strong>Transport:</strong> HTTPS and TLS, JSON payloads, OAuth 2 client credentials for authorization.</li>
<li><strong>Push:</strong> MQTT, so a client behind a home router receives server-initiated notifications without polling. Added in 3.1.</li>
<li><strong>Client footprint:</strong> implemented on an <strong>ESP32 with integrated Wi-Fi, under $5 in quantity.</strong></li>
<li><strong>Same protocol, any server:</strong> a manufacturer's, a seller of electricity, an aggregator, or one running in the customer's house.</li>
<li><strong>A free public server is running now</strong>, carrying real California prices and grid emissions, with client tutorials, no account and no enrollment.</li>
</ul>

<h2 id="the-matter-energy-clusters-by-name">The Matter energy clusters, by name</h2>
<ul>
<li><strong>Device Energy Management</strong>, and <strong>Device Energy Management Mode</strong>: what a device plans to do, and the ability to shift that plan. The manager reads a <code>Forecast</code> and reshapes it with <code>PowerAdjustRequest</code>, <code>StartTimeAdjustRequest</code>, <code>ModifyForecastRequest</code>, <code>PauseRequest</code> and <code>ResumeRequest</code>. Each carries an <code>AdjustmentCause</code> of <code>LocalOptimization</code> or <code>GridOptimization</code>, and <code>OptOutState</code> is read-only over the network.</li>
<li><strong>Energy EVSE</strong>, and <strong>Energy EVSE Mode.</strong></li>
<li><strong>Water Heater Management</strong>, and <strong>Water Heater Mode.</strong></li>
<li><strong>Thermostat.</strong></li>
<li><strong>Electrical Power Measurement</strong>, and <strong>Electrical Energy Measurement.</strong></li>
</ul>
<div class="band">
<p><strong>These clusters exist in the specification today.</strong> The commissioner is the customer's, so the fabric is the customer's.</p>

<h2 id="electrification-bus-and-what-else-is-in-this-layer">Electrification Bus, and what else is in this layer</h2>
<ul>
<li><strong>A different device population:</strong> the panel, the meter, inverters, batteries, the microgrid interconnect device. <strong>The homeowner pays for them, but does not install or commission them.</strong> That is licensed work, under an electrical code (the NEC in the US) and an inspection. <strong>Matter may well report their state and offer a customer sensible controls, and that is fine. What it will not do is the detailed interoperation between them.</strong></li>
<li><strong>Today each one meters what it can and shares nothing.</strong> Control paths run through vendor clouds that fail during exactly the outages when local coordination matters most, and every device-to-device integration is a bespoke project between two vendors.</li>
<li><strong>What <a href="https://ebus.energy">Electrification Bus</a> (eBus for short) defines:</strong> how these devices discover each other, publish what they measure, and coordinate locally with no cloud in the loop. MQTT on the home network, Homie v5 semantics, mDNS discovery. Specification and reference work are public.</li>
<li><strong>S2</strong>, the European counterpart: complementary, not competing. It exchanges <strong>flexibility patterns</strong> rather than device commands, keeping the manufacturer in control of the appliance and the customer in control of the outcome. It sits at roughly the layer Matter's energy clusters occupy, not at the grid boundary. <strong>Nothing in this deck changes if S2 wins inside the house.</strong></li>
</ul>
<div class="cap">
<p><strong>eBus is my own proposal, and I wrote the specification.</strong> It should be held to the same tests as everything else in this deck.</p>
</div>

<h2 id="ensured-not-enabled">Ensured, not enabled</h2>
<table>
<thead>
<tr>
<th></th>
<th><strong>Ensured</strong></th>
<th><strong>Enabled</strong></th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>What the appliance has</strong></td>
<td>An open protocol, a network interface, and a server address the owner can change</td>
<td>A connector, and a promise that some other device will do the rest</td>
</tr>
<tr>
<td><strong>What the customer does</strong></td>
<td>Connects it</td>
<td>Buys a module, installs it, configures it to Wi-Fi, and accepts whatever that module speaks upstream</td>
</tr>
<tr>
<td><strong>Cost to participate</strong></td>
<td>Zero</td>
<td>Well over $150, plus a truck roll or a frustrated homeowner</td>
</tr>
<tr>
<td><strong>Result</strong></td>
<td>It participates</td>
<td>It usually does not</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>The gap between enabled and ensured is where every flexible demand mandate of the last decade has died.</strong> Write the standard so that compliance means ensured.</p>
</blockquote>

<h3 id="ahri-1380">AHRI 1380</h3>
<h2 id="what-actually-ships-and-what-could">What actually ships, and what could</h2>
<div class="cap" style="margin-top:0">
<p>The standard permits a local interface. <strong>Everything on the left conforms to it, and that is exactly the problem:</strong> a standard that permits the left-hand picture gets the left-hand picture, and so does any rule that accepts the 2019 edition as evidence.</p>
</div>
<div class="columns">
<div>
<p><img src="images/1380-2019-OA2-Cloud.png" alt="" style="height:350px;" /></p>
<div class="cap">
<p><strong>Today:</strong> DR provider VTN, manufacturer VEN in the manufacturer's cloud, private protocol down to the equipment in the house. The house speaks nothing open.</p>
</div>
</div>
<div>
<p><img src="images/cloud-to-native-hvac-oa31.png" alt="" style="height:350px;" /></p>
<div class="cap">
<p><strong>Instead:</strong> the VEN in the equipment. Same DR provider, same standard family, one fewer party, and a server address the owner can change.</p>
</div>
</div>
</div>

<h2 id="the-manufacturers-objection-and-the-answer">The manufacturer's objection, and the answer</h2>
<ul>
<li><strong>What they say:</strong> the cost of the parts, and a ten-year support obligation on a device they no longer control.</li>
<li><strong>The customer already bought the parts.</strong> Every one of these appliances ships with a microcontroller and a Wi-Fi radio, on the customer's receipt. The customer still cannot talk to the thing they own without going through the manufacturer.</li>
<li><strong>What the closed path actually protects:</strong> the customer relationship, the customer's usage data, and a share of whatever that customer's load shifting earns.</li>
<li><strong>A customer-configurable server reduces the obligation they say worries them.</strong> They stop being the mandatory operator of a cloud service for the life of the appliance.</li>
</ul>
<div class="band">
<p><strong>The support burden is real, and it is answerable.</strong> The claim on the customer's data, and on a share of what the customer's load shifting earns, is not a burden. <strong>It is a business model.</strong></p>
</div>

<h2 id="what-the-partial-marks-are-conceding">What the partial marks are conceding</h2>
<ul>
<li><strong>OCPP 2.1 defines tariff messages.</strong> That is real and current, and it is why OCPP scores partial on price rather than blank. The unit of management is still one charger.</li>
<li><strong>CSIP and IEEE 2030.5 can set an export limit at the point of common coupling.</strong> Also real, and also why that cell is partial rather than blank. The limit governs the inverter rather than the service connection, and it is offered to a utility program rather than to a residential customer.</li>
<li><strong>Both are conceded before they are raised.</strong> Neither carries a price and a connection limit to every appliance in the house, over one open protocol, to a server the customer can point somewhere else. That is what the scorecard is scoring.</li>
</ul>

<h2 id="is-a-customer-configurable-server-a-security-problem-no">Is a customer-configurable server a security problem? No.</h2>
<ul>
<li><strong>It is a setting</strong>, in the same sense that choosing an email provider is a setting. The manufacturer still ships a working default. What changes is that the default is not a lock.</li>
<li><strong>The two signals have different risk profiles, and that is the whole answer.</strong> Server choice affects the <strong>price</strong>, which is economic: a wrong price costs money. It does not affect the <strong>limit</strong>, which is enforced at the connection by the listed power control system regardless of what the customer configured.</li>
<li><strong>The home can reject an implausible value locally</strong>, which a direct-control architecture cannot do.</li>
<li><strong>Today's arrangement is the larger attack surface:</strong> dozens of vendor clouds, none subject to utility-grade review, each holding the ability to operate appliances inside homes.</li>
</ul>
<div class="band">
<p><strong>A price is a one-way number. A command is a key to somebody's house.</strong></p>
</div>

<h2 id="machine-readable-tariffs">Machine-readable tariffs</h2>
<blockquote>
<p><strong>The appliance should never need a tariff engine, only an interval consumer.</strong> That requires the tariff to be published in a computable form.</p>
</blockquote>
<ul>
<li><strong>The open <a href="https://lfenergy.org/projects/utility-rate-plan-exchange-urpx/">Utility Rate Plan Exchange (URPX)</a> standard, hosted by LF Energy, is built for exactly this.</strong> I contribute to it; it is an open standard, not a product.</li>
<li><strong>A time-of-use rate is a price stream with fewer changes, and a flat rate is one with none.</strong> Same mechanism, same appliance, whatever tariff the customer is on. Nothing waits for dynamic pricing to arrive.</li>
<li><strong>And what to retire:</strong> tariff attributes a price stream cannot carry. <strong>A demand charge is the clearest example</strong>, because it prices a peak after the fact, so no device can act on it from the signal alone.</li>
</ul>
<footer>grid-coordination.energy<span class="who">DC Jackson</span></footer>

<h2 id="three-interfaces-three-listings-one-usb-c-port">Three interfaces, three listings, one USB-C port</h2>
<div class="columns3">
<div>
<p><img src="images/Ethernet-dongle.png" alt="" style="width:350px;" /></p>

<div>

</div>
</div>
<div class="cap">
<p>Left to right: a USB-C to Gigabit Ethernet adapter at <strong>$15.19</strong>, an unlocked 4G LTE modem with a SIM slot at <strong>$39.99</strong>, and a USB Wi-Fi adapter at <strong>$11.99</strong>. All three are class-compliant, all three are ordinary retail listings, and all three plug into the same port. The cheapest Ethernet adapter on the main line is <strong>$4.76</strong>.</p>

<div class="band">
