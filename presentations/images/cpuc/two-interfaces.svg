<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" font-family="Avenir Next, Avenir, -apple-system, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#2A6E3F"/></marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#B25B27"/></marker>
  </defs>
  <rect width="1000" height="300" fill="#FFFFFF"/>

  <!-- the home -->
  <rect x="356" y="46" width="629" height="216" rx="14" fill="#F4F8F5" stroke="#2A6E3F" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="975" y="72" font-size="13" font-weight="600" letter-spacing="2.2" fill="#2A6E3F" text-anchor="end">THE CUSTOMER'S HOME</text>

  <!-- boxes -->
  <rect x="16" y="122" width="192" height="86" rx="8" fill="#EEF0F2" stroke="#7A8592" stroke-width="1.8"/>
  <text x="112" y="158" font-size="16" font-weight="600" fill="#16212E" text-anchor="middle">Demand-side</text>
  <text x="112" y="180" font-size="16" font-weight="600" fill="#16212E" text-anchor="middle">resource service</text>
  <text x="112" y="199" font-size="13" fill="#7A8592" text-anchor="middle">a utility, or a provider</text>

  <rect x="392" y="122" width="200" height="86" rx="8" fill="#FFFFFF" stroke="#2A6E3F" stroke-width="2.6"/>
  <text x="492" y="158" font-size="17" font-weight="600" fill="#16212E" text-anchor="middle">Energy manager</text>
  <text x="492" y="180" font-size="13" fill="#2A6E3F" text-anchor="middle">an appliance, a hub,</text>
  <text x="492" y="197" font-size="13" fill="#2A6E3F" text-anchor="middle">or a service you chose</text>

  <rect x="770" y="122" width="196" height="86" rx="8" fill="#FFFFFF" stroke="#C6D3C9" stroke-width="1.8"/>
  <text x="868" y="158" font-size="17" font-weight="600" fill="#16212E" text-anchor="middle">Energy smart</text>
  <text x="868" y="180" font-size="17" font-weight="600" fill="#16212E" text-anchor="middle">appliance</text>

  <!-- interface A -->
  <line x1="208" y1="165" x2="386" y2="165" stroke="#2A6E3F" stroke-width="2.6" marker-end="url(#ag)"/>
  <text x="297" y="132" font-size="13" font-weight="600" letter-spacing="2.2" fill="#2A6E3F" text-anchor="middle">INTERFACE A</text>
  <text x="297" y="192" font-size="16" font-weight="600" fill="#16212E" text-anchor="middle">OpenADR 3</text>
  <text x="297" y="211" font-size="13" fill="#7A8592" text-anchor="middle">over the Internet</text>

  <!-- interface B -->
  <line x1="592" y1="165" x2="764" y2="165" stroke="#B25B27" stroke-width="2.6" marker-end="url(#ac)"/>
  <text x="678" y="132" font-size="13" font-weight="600" letter-spacing="2.2" fill="#B25B27" text-anchor="middle">INTERFACE B</text>
  <text x="678" y="192" font-size="16" font-weight="600" fill="#16212E" text-anchor="middle">Matter</text>
  <text x="678" y="211" font-size="13" fill="#7A8592" text-anchor="middle">over the home network</text>

  <text x="500" y="288" font-size="14" fill="#7A8592" text-anchor="middle">Two interfaces. Two protocols. Every appliance in the house sits at the same place in this picture.</text>
</svg>
