<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580" width="1120" height="580" font-family="Avenir Next, Avenir, -apple-system, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#7A8592"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#2A6E3F"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#B25B27"/></marker>
  </defs>
  <rect width="1120" height="580" fill="#FFFFFF"/>
  <text x="150" y="64" font-size="13" font-weight="600" letter-spacing="2.2" fill="#7A8592" text-anchor="end">UTILITY</text>
  <text x="158" y="300" font-size="13" font-weight="600" letter-spacing="2.2" fill="#2A6E3F" text-anchor="end">YOUR</text>
  <text x="158" y="322" font-size="13" font-weight="600" letter-spacing="2.2" fill="#2A6E3F" text-anchor="end">HOME</text>
  <rect x="414" y="32" width="320" height="58" rx="8" fill="#EEF0F2" stroke="#C3CAD1" stroke-width="1.8"/>
  <text x="574.0" y="67.0" font-size="17" font-weight="600" fill="#16212E" text-anchor="middle">Your utility publishes two signals</text>
  <rect x="298" y="128" width="236" height="50" rx="8" fill="#E6EFE8" stroke="#2A6E3F" stroke-width="1.8"/>
  <text x="416.0" y="159.0" font-size="17" font-weight="600" fill="#2A6E3F" text-anchor="middle">A price, hour by hour</text>
  <rect x="614" y="128" width="236" height="50" rx="8" fill="#F7EBE2" stroke="#B25B27" stroke-width="1.8"/>
  <text x="732.0" y="150.0" font-size="17" font-weight="600" fill="#B25B27" text-anchor="middle">A limit on your service</text>
  <text x="732.0" y="169.0" font-size="13" fill="#B25B27" text-anchor="middle">import and export</text>
  <line x1="510" y1="92" x2="428" y2="124" stroke="#2A6E3F" stroke-width="2.4" marker-end="url(#g)"/>
  <line x1="638" y1="92" x2="720" y2="124" stroke="#B25B27" stroke-width="2.4" marker-end="url(#c)"/>
  <line x1="416" y1="178" x2="416" y2="244" stroke="#2A6E3F" stroke-width="2.4" marker-end="url(#g)"/>
  <line x1="732" y1="178" x2="732" y2="244" stroke="#B25B27" stroke-width="2.4" marker-end="url(#c)"/>
  <text x="574" y="203" font-size="14" font-weight="600" letter-spacing="1.8" fill="#7A8592" text-anchor="middle">ONE OPEN PROTOCOL, OVER THE INTERNET</text>
  <text x="574" y="225" font-size="14" font-weight="600" letter-spacing="1.8" fill="#7A8592" text-anchor="middle">STRAIGHT TO THE CUSTOMER</text>
  <rect x="178" y="248" width="792" height="292" rx="14" fill="#F4F8F5" stroke="#2A6E3F" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="384" y="274" width="380" height="76" rx="8" fill="#FFFFFF" stroke="#2A6E3F" stroke-width="2.6"/>
  <text x="574.0" y="309.0" font-size="19" font-weight="600" fill="#16212E" text-anchor="middle">You choose what makes the decisions</text>
  <text x="574.0" y="330.0" font-size="14" fill="#2A6E3F" text-anchor="middle">an appliance itself &#183; a hub you own &#183; a service you picked</text>
  <line x1="574" y1="350" x2="266" y2="424" stroke="#2A6E3F" stroke-width="1.8" marker-end="url(#g)"/>
  <rect x="196" y="426" width="140" height="50" rx="8" fill="#FFFFFF" stroke="#C6D3C9" stroke-width="1.8"/>
  <text x="266.0" y="457.0" font-size="15" font-weight="600" fill="#16212E" text-anchor="middle">EV charger</text>
  <line x1="574" y1="350" x2="418" y2="424" stroke="#2A6E3F" stroke-width="1.8" marker-end="url(#g)"/>
  <rect x="348" y="426" width="140" height="50" rx="8" fill="#FFFFFF" stroke="#C6D3C9" stroke-width="1.8"/>
  <text x="418.0" y="457.0" font-size="15" font-weight="600" fill="#16212E" text-anchor="middle">Water heater</text>
  <line x1="574" y1="350" x2="570" y2="424" stroke="#2A6E3F" stroke-width="1.8" marker-end="url(#g)"/>
  <rect x="500" y="426" width="140" height="50" rx="8" fill="#FFFFFF" stroke="#C6D3C9" stroke-width="1.8"/>
  <text x="570.0" y="457.0" font-size="15" font-weight="600" fill="#16212E" text-anchor="middle">Heat pump</text>
  <line x1="574" y1="350" x2="722" y2="424" stroke="#2A6E3F" stroke-width="1.8" marker-end="url(#g)"/>
  <rect x="652" y="426" width="140" height="50" rx="8" fill="#FFFFFF" stroke="#C6D3C9" stroke-width="1.8"/>
  <text x="722.0" y="457.0" font-size="15" font-weight="600" fill="#16212E" text-anchor="middle">Battery</text>
  <line x1="574" y1="350" x2="874" y2="424" stroke="#2A6E3F" stroke-width="1.8" marker-end="url(#g)"/>
  <rect x="804" y="426" width="140" height="50" rx="8" fill="#FFFFFF" stroke="#C6D3C9" stroke-width="1.8"/>
  <text x="874.0" y="457.0" font-size="15" font-weight="600" fill="#16212E" text-anchor="middle">Solar</text>
  <text x="574" y="502" font-size="16" fill="#2A6E3F" text-anchor="middle">One house, coordinated as one house</text>
  <text x="574" y="524" font-size="14" fill="#5E7A68" text-anchor="middle">over the home network: Wi-Fi, Ethernet or Thread</text>
  <rect x="880" y="128" width="204" height="50" rx="8" fill="#FFFFFF" stroke="#7A8592" stroke-width="1.8" stroke-dasharray="6 5"/>
  <text x="982" y="150" font-size="16" font-weight="600" fill="#7A8592" text-anchor="middle">An aggregator</text>
  <text x="982" y="168" font-size="13" fill="#7A8592" text-anchor="middle">optional, and your choice</text>
  <line x1="736" y1="70" x2="970" y2="124" stroke="#7A8592" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#a)"/>
  <path d="M1050,178 L1050,312 L774,312" fill="none" stroke="#7A8592" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#a)"/>
</svg>
