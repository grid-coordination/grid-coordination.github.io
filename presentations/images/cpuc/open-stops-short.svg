<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 492" width="1120" height="492" font-family="Avenir Next, Avenir, -apple-system, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#16212E"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#2A6E3F"/></marker>
  </defs>
  <rect width="1120" height="492" fill="#FFFFFF"/>
  <text x="60" y="46" font-size="14" font-weight="600" letter-spacing="2.4" fill="#7A8592">WHAT COMPLIANCE USUALLY LOOKS LIKE TODAY</text>
  <rect x="60" y="70" width="200" height="62" rx="8" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1.8"/>
  <text x="160.0" y="107.0" font-size="17" font-weight="600" fill="#16212E" text-anchor="middle">Appliance</text>
  <line x1="266" y1="101" x2="366" y2="101" stroke="#16212E" stroke-width="2.4" marker-end="url(#k)"/>
  <text x="316" y="90" font-size="14" fill="#16212E" text-anchor="middle">private</text>
  <rect x="374" y="70" width="280" height="62" rx="8" fill="#F0F2F4" stroke="#C3CAD1" stroke-width="1.8"/>
  <text x="514.0" y="107.0" font-size="17" font-weight="600" fill="#16212E" text-anchor="middle">Manufacturer&#8217;s cloud</text>
  <line x1="660" y1="101" x2="774" y2="101" stroke="#2A6E3F" stroke-width="2.8" marker-end="url(#g)"/>
  <text x="717" y="90" font-size="14" font-weight="600" fill="#2A6E3F" text-anchor="middle">open standard</text>
  <rect x="782" y="70" width="200" height="62" rx="8" fill="#F0F2F4" stroke="#C3CAD1" stroke-width="1.8"/>
  <text x="882.0" y="107.0" font-size="17" font-weight="600" fill="#16212E" text-anchor="middle">Utility</text>
  <path d="M660,148 L660,160 L774,160 L774,148" fill="none" stroke="#2A6E3F" stroke-width="1.8"/>
  <text x="717" y="184" font-size="17" font-weight="600" fill="#2A6E3F" text-anchor="middle">If there is an open part today, it is here:</text>
  <text x="717" y="206" font-size="17" font-weight="600" fill="#2A6E3F" text-anchor="middle">where the customer cannot reach it, and access is not free.</text>
  <line x1="60" y1="246" x2="1060" y2="246" stroke="#D3D9DE" stroke-width="1"/>
  <text x="60" y="292" font-size="14" font-weight="600" letter-spacing="2.4" fill="#2A6E3F">WHAT IT SHOULD LOOK LIKE</text>
  <rect x="60" y="341" width="200" height="62" rx="8" fill="#FFFFFF" stroke="#2A6E3F" stroke-width="2.4"/>
  <text x="160.0" y="378.0" font-size="17" font-weight="600" fill="#16212E" text-anchor="middle">Appliance</text>
  <line x1="266" y1="372" x2="452" y2="372" stroke="#2A6E3F" stroke-width="2.8" marker-end="url(#g)"/>
  <text x="358" y="361" font-size="14" font-weight="600" fill="#2A6E3F" text-anchor="middle">open standard</text>
  <text x="358" y="396" font-size="13" fill="#7A8592" text-anchor="middle">server address: a setting</text>
  <line x1="470" y1="320" x2="470" y2="424" stroke="#2A6E3F" stroke-width="2"/>
  <line x1="470" y1="320" x2="556" y2="320" stroke="#2A6E3F" stroke-width="2.4" marker-end="url(#g)"/>
  <rect x="564" y="300" width="340" height="40" rx="8" fill="#E6EFE8" stroke="#2A6E3F" stroke-width="1.8"/>
  <text x="734.0" y="326.0" font-size="16" font-weight="600" fill="#2A6E3F" text-anchor="middle">My utility</text>
  <line x1="470" y1="372" x2="556" y2="372" stroke="#2A6E3F" stroke-width="2.4" marker-end="url(#g)"/>
  <rect x="564" y="352" width="340" height="40" rx="8" fill="#E6EFE8" stroke="#2A6E3F" stroke-width="1.8"/>
  <text x="734.0" y="378.0" font-size="16" font-weight="600" fill="#2A6E3F" text-anchor="middle">A provider I chose</text>
  <line x1="470" y1="424" x2="556" y2="424" stroke="#2A6E3F" stroke-width="2.4" marker-end="url(#g)"/>
  <rect x="564" y="404" width="340" height="40" rx="8" fill="#E6EFE8" stroke="#2A6E3F" stroke-width="1.8"/>
  <text x="734.0" y="430.0" font-size="16" font-weight="600" fill="#2A6E3F" text-anchor="middle">My own energy manager</text>
  <text x="560" y="478" font-size="18" fill="#16212E" text-anchor="middle">One setting. Three legitimate answers. <tspan font-weight="600">The customer picks.</tspan></text>
</svg>
