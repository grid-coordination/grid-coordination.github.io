<h3 id="the-goal">The goal</h3>
<h2 id="why-coordinate-water-heaters-with-the-grid">Why coordinate water heaters with the grid?</h2>
<ul>
<li><strong>What.</strong><br />Give high-load appliances the ability to shift <em>when</em> they consume, and to back off when the grid needs them to. <strong>An electric storage water heater is the cheapest thermal battery in the house</strong>, and the best candidate there is: it already stores energy, and nobody notices when it heats.</li>
<li><strong>Cost.</strong><br />Deliver that flexibility affordably, and put the cost where it will actually get paid. Every approach puts it somewhere: on the manufacturer as unit and development cost, on the utility as program cost, or on the customer as money and effort. <strong>The question is never whether there is a cost. It is who pays it, and whether they notice.</strong></li>
<li><strong>Control.</strong><br />Let the flexibility be managed from wherever produces the most benefit: by the utility or load-serving entity, by a demand response provider, <strong>or by the customer's own energy management system.</strong> The appliance may ship pre-configured for any of the three. <strong>The customer must be able to change which one manages it, and from where.</strong></li>
</ul>

<h3 id="the-2013-design">The 2013 design</h3>
<h2 id="the-problem-was-real-and-the-2013-design-fit-it">The problem was real, and the 2013 design fit it</h2>
<ul>
<li><strong>The problem was real and it still is.</strong><br />An electric storage water heater is the cheapest thermal battery in the house. Getting it to shift is worth doing, and in 2013 essentially nothing in a house could receive an outside signal at all.</li>
<li><strong>The engineering answer was correct for 2013.</strong> A water heater lasts twelve to fifteen years. Home networking did not stay still for twelve to fifteen years. Putting the radio in a replaceable module, and standardizing the socket between the module and the appliance, is the textbook answer to a component whose lifetime is shorter than its host's.</li>
<li><strong>Ex ante, this seemed like a good solution.</strong><br />The problem is not in the <strong>standard</strong>. It is in the <strong>rule</strong> that names it, and in what happened above the socket.</li>
</ul>
<div class="band">
<p><strong>Thirteen years have passed. Let's assess how it has worked, and whether to change course.</strong></p>
</div>

<h3 id="so-we-are-using-the-same-words">So we are using the same words</h3>
<h2 id="a-socket-in-the-appliance-and-a-module-the-customer-chooses">A socket in the appliance, and a module the customer chooses</h2>
<div class="columns" style="grid-template-columns: 1fr 1.25fr">
<div>
<p><img src="images/DRP-UCM-SGD.png" alt="" style="height:330px;" /></p>
<div class="cap">
<p>The appliance carries the socket. The module carries the radio. <strong>The link at the top is whatever the module vendor chose.</strong></p>
</div>
</div>
<div>
<ul>
<li><strong>SGD, the appliance.</strong><br />The CTA-2045 socket and the microcontroller behind it. The appliance's behavior in response to a signal is deliberately not specified: the committee left that to the manufacturer on purpose.</li>
<li><strong>UCM, the module.</strong><br />The other half of the socket, a network interface (Wi-Fi, cellular or Ethernet), a microcontroller of its own, and a link upstream to a demand response provider.</li>
<li><strong>The premise, in CTA's own words:</strong> &quot;Consumers select an appropriate communications module to plug into their appliances based on the networking system... in their homes.&quot;</li>
<li><strong>That premise has two halves.</strong><br />The appliance half is a socket, and it got built. The customer half is a market of modules to select from.</li>
</ul>
</div>
</div>

<h3 id="where-the-open-part-stops-today">WHERE THE OPEN PART STOPS TODAY</h3>
<h2 id="the-socket-is-open-the-decision-about-who-reaches-it-is-not">The socket is open. The decision about who reaches it is not.</h2>
<p><img src="images/cpuc/open-stops-short.svg" alt="" style="width:840px;" /></p>
<ul>
<li><strong>The price object is in the message set. Nothing standardizes how a real tariff reaches it.</strong> Which price arrives, and from whom, is decided by whichever cloud the module vendor runs. <strong>That is outside CTA-2045 by design, and the design is the problem.</strong></li>
<li><strong>The Alliance's own architecture figure labels the segment above the module &quot;Any Communication System.&quot;</strong> Deliberately, and correctly: it is outside the standard's scope. <strong>A rule that stops where the standard stops inherits that boundary.</strong></li>
</ul>

<h3 id="the-goal-and-the-distance-from-it">THE GOAL, AND THE DISTANCE FROM IT</h3>
<h2 id="every-new-water-heater-should-ship-able-to-coordinate">Every new water heater should ship able to coordinate</h2>
<div class="cap" style="margin-top:0">
<p><strong>Not a pilot, not a program, not a subset of one state. Every new electric storage water heater sold</strong>, the way every one of them already ships able to heat water. <strong>That is the only target worth writing a rule for</strong>, and it is the target the mandate was written to reach.</p>
</div>
<table>
<thead>
<tr>
<th></th>
<th></th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>None reported</strong></td>
<td>No grid-enabled water heater additions reported in Washington, Oregon or New York, in any year 2020 through 2024, in the federal field that asks</td>
</tr>
<tr>
<td><strong>39</strong></td>
<td>CTA-2045 modules deployed in Oregon's largest water heater demand response pilot, against 11,703 retrofit switches</td>
</tr>
<tr>
<td><strong>2,000</strong></td>
<td>The unit cap on Washington's largest utility's first water heater demand response product, launched 2025</td>
</tr>
<tr>
<td><strong>5 million</strong></td>
<td>US residential electric storage water heaters shipped, <strong>per year</strong></td>
</tr>
</tbody>
</table>
<div class="cap">
<p>No published participation rate exists, at NEEA, BPA, EPRI, PNNL, DOE, either state commission, EIA, AHRI or the Alliance's own product database. These are the numbers that do. <strong>Against five million a year, none of them is within sight of the goal.</strong> Sources and caveats in the appendix.</p>
</div>

<h3 id="what-stands-between-the-port-and-a-connected-appliance">WHAT STANDS BETWEEN THE PORT AND A CONNECTED APPLIANCE</h3>
<h2 id="every-connected-water-heater-costs-a-module-and-a-visit">Every connected water heater costs a module and a visit</h2>
<div class="columns">
<div>
<ul>
<li><strong>A module.</strong><br />Bought by the program operator at volume pricing, not by the customer at retail. Assume roughly <strong>$100</strong>, or <strong>$150</strong> for cellular. <strong>Every new enrollment costs another one.</strong></li>
<li><strong>An installation.</strong><br />In the garage, in a closet, behind the furnace.</li>
<li><strong>A network join.</strong><br />Which nobody notices failing later, because nothing else stops working.</li>
</ul>
</div>
<div>
<p><img src="images/example-ucm.jpeg" alt="" style="height:280px;" /></p>
<div class="cap">
<p><strong>Everything in this photograph is a second computer alongside the first one.</strong></p>
</div>
</div>
</div>
<div class="ask">
<p><strong>A per-unit cost caps program size.</strong><br />Washington's largest utility launched at 2,000 units in 2025, giving the module away and paying $20 toward the install. <strong>A client already in the appliance costs nothing per unit.</strong></p>
</div>

<h2 id="when-the-gap-is-too-wide-to-jump">When the gap is too wide to jump</h2>
<p><img src="images/car-jumping-crash.jpg" alt="" style="width:480px;" /></p>
<div class="ask">
<p>Four jurisdictions required the port. The distance from the port to a connected appliance turned out to be three steps:</p>
<ul>
<li><strong>A $209 second computer</strong></li>
<li><strong>An installation</strong></li>
<li><strong>A network credential typed in a basement</strong></li>
</ul>
<p>Every one of them had to be crossed voluntarily, by a customer who did not know the port existed.</p>
<p><strong>Nobody designing this in 2013 could have known the jump was that wide.</strong><br /><strong>We know now.</strong></p>
</div>

<h3 id="the-premise-and-what-happened-to-it">THE PREMISE, AND WHAT HAPPENED TO IT</h3>
<h2 id="the-premise-is-gone-and-the-cost-case-inverted-with-it">The premise is gone, and the cost case inverted with it</h2>
<ul>
<li><strong>The 2013 premise was that an appliance could not be assumed to have a network connection.</strong> So put the radio in a replaceable module and standardize the socket.</li>
<li><strong>Rheem's ProTerra page lists both on one model:</strong> &quot;Built-in Wi-Fi Powered by EcoNet&quot; <strong>and</strong> a &quot;built-in EcoPort (CTA-2045 port).&quot; <strong>The customer paid for two connections, and exactly one of them is reachable by anyone other than Rheem.</strong></li>
<li><strong>And a physical port splits the product line.</strong><br />The mandate is why any of these models exist, and nobody would have built them otherwise. But a port costs money and four states require it, so it ships as a demand-response variant: Rheem's compliance bulletin lists eight, by state, and the cheapest carries the port and <strong>no Wi-Fi at all</strong>. <strong>Firmware does not split a product line.</strong></li>
</ul>
<div class="band">
<p><strong>In 2013 a radio in every appliance was the expensive option.</strong><br />On a tank that already ships with Wi-Fi, the module is a second computer doing what the first one already does. <strong>Mandating the socket is now the more expensive way to reach the same appliance.</strong></p>
</div>

<h3 id="the-design-target">The design target</h3>
<h2 id="two-interfaces-and-a-water-heater-needs-both">Two interfaces, and a water heater needs both</h2>
<p><img src="images/cpuc/water-heater-two-paths.svg" alt="" style="width:730px;" /></p>
<div class="columns">
<div class="lever">
<h4 id="interface-a-across-the-grid-boundary">Interface A, across the grid boundary</h4>
<p>A <strong>price with a forward schedule</strong>, over an open protocol, from a server the customer can point somewhere else.</p>
</div>
<div class="lever">
<h4 id="interface-b-inside-the-house">Interface B, inside the house</h4>
<p>If the customer runs an energy manager, it should be able to <strong>drive the tank directly, over the home network</strong>.</p>
</div>
</div>
<div class="ask">
<p><strong>The appliance should be able to do either, in the same product, so the customer chooses.</strong> Receive the price and decide for itself, or take direction from something in the house that has the price.</p>

<h3 id="what-is-already-in-the-appliance-and-what-to-add">WHAT IS ALREADY IN THE APPLIANCE, AND WHAT TO ADD</h3>
<h2 id="the-hardware-is-already-there-this-is-firmware">The hardware is already there. This is firmware.</h2>
<div class="cap" style="margin-top:0">
<p><strong>Many water heaters already ship with a microcontroller and a Wi-Fi interface</strong>, because the manufacturer wanted a cloud client of its own. <strong>The ask is firmware on hardware the customer has already paid for</strong>: no new part, no new silicon, no second computer.</p>
</div>
<table>
<thead>
<tr>
<th></th>
<th></th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>OpenADR 3</strong>, to the grid</td>
<td>A price with a forward schedule, a day ahead in one object, from <strong>a server address the owner can change</strong>. Ordinary web technology: HTTPS over TLS, JSON, OAuth 2. <strong>Explicitly not PKI.</strong> Against a public tariff server, all the tank holds is a URL</td>
</tr>
<tr>
<td><strong>Matter</strong>, inside the house</td>
<td>Local control by whatever energy manager the customer runs, <strong>and the tank appearing in the home ecosystem app the customer already uses.</strong> <strong>Water Heater Management</strong> for the tank's own controls, <strong>Device Energy Management</strong> for the energy semantics a manager negotiates against</td>
</tr>
</tbody>
</table>
<div class="ask">
<p><strong>The manufacturer's own cloud, over whatever protocol it likes, is the manufacturer's business and is not in scope here.</strong> Keep it, make it the default. <strong>The ask is only that it not be the only way in.</strong></p>
</div>
<footer>grid-coordination.energy<span class="who">DC Jackson</span></footer>

<h3 id="why-both-and-not-either-one-alone">WHY BOTH, AND NOT EITHER ONE ALONE</h3>
<h2 id="matter-alone-is-enabled-not-ensured">Matter alone is enabled, not ensured</h2>
<table>
<thead>
<tr>
<th></th>
<th style="text-align:center">Matter only</th>
<th style="text-align:center">OpenADR 3 only</th>
<th style="text-align:center">Both</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Can it get a price?</strong></td>
<td style="text-align:center">Only if something on the home network already has one</td>
<td style="text-align:center">Yes, directly</td>
<td style="text-align:center">Yes, either way</td>
</tr>
<tr>
<td><strong>Can an energy manager drive it?</strong></td>
<td style="text-align:center">Fully</td>
<td style="text-align:center">Weakly</td>
<td style="text-align:center">Fully</td>
</tr>
<tr>
<td><strong>Verdict</strong></td>
<td style="text-align:center"><strong>Enabled</strong></td>
<td style="text-align:center"><strong>Ensured, for price</strong></td>
<td style="text-align:center"><strong>Ensured, and controllable</strong></td>
</tr>
</tbody>
</table>
<div class="cap">
<p><strong>Matter is a home-network protocol.</strong><br />For a Matter-only water heater to act on a price, an energy manager the customer has to acquire must already have one. <strong>That is the same shape of failure as the socket:</strong> the appliance is ready, and a second purchase stands between it and participation. The distance is shorter and closing. Shorter is not zero.</p>
</div>
<div class="band">
<p><strong>With both, an energy manager has three ways to work:</strong> publish the local price over Matter's own price clusters, publish it over OpenADR 3 as a local server, or drive the tank directly over Device Energy Management. <strong>And a house with no energy manager is still served.</strong></p>
</div>

<h3 id="testable-language-no-version-numbers">Testable language. No version numbers.</h3>
<h2 id="write-the-capability-not-the-standard">Write the capability, not the standard</h2>
<table>
<thead>
<tr>
<th>Write this, in the rule</th>
<th>Not this</th>
</tr>
</thead>
<tbody>
<tr>
<td>A price with a forward schedule, over an open protocol, <strong>received in the appliance itself</strong></td>
<td>&quot;A modular port compliant with [named standard, named edition]&quot;</td>
</tr>
<tr>
<td>A server address <strong>the owner can change</strong></td>
<td>&quot;The manufacturer shall provide a demand response interface&quot;</td>
</tr>
<tr>
<td><strong>Action on the last schedule with no network</strong></td>
<td>Nothing, which is what these rules say today about outages</td>
</tr>
<tr>
<td><strong>Both</strong> the water-heater-specific and the generic energy-management semantics</td>
<td>&quot;Shall support [a smart home standard]&quot;</td>
</tr>
</tbody>
</table>
<div class="bandc">
<p><strong>The same gap exists inside the standard I am recommending.</strong><br />The Matter Water Heater device type does not require Device Energy Management at all, and inside DEM every adjustment feature is optional. <strong>A fully certified Matter water heater can ship with no forecast and no shiftability</strong>, which is exactly why a rule must name the capability and not the protocol.</p>
</div>
<footer>grid-coordination.energy<span class="who">DC Jackson</span></footer>

<h2 id="my-proposal">My proposal</h2>
<ul>
<li><strong>Retire CTA-2045 as a water heater requirement.</strong><br />Not an additional compliance path. Not a fix to the link above the socket. <strong>Retire it.</strong> The port competes with the better answer for the same dollars and the same engineering attention.</li>
<li><strong>Require instead, of the appliance itself, three things. One: both protocols.</strong> OpenADR 3 to the grid, and Matter inside the house covering <strong>both</strong> Water Heater Management and Device Energy Management. <strong>Two: at least one network interface</strong>, integrated. Everyone will choose Wi-Fi, and that is fine. <strong>Three: support for adding another</strong>, as a USB-C host port for a class-compliant adapter. Ethernet or cellular becomes the customer's choice, without putting three radios in every unit.</li>
<li><strong>Write the capability and the test method. Put standards in an appendix.</strong> Name OpenADR 3 and Matter. Name no edition of either, and no version number anywhere in the requirement itself. <strong>Naming a protocol is not the mistake. Freezing an edition of it is</strong>, and that is the mistake in force today.</li>
<li><strong>This needs no new legislation to start.</strong><br />Washington and Oregon already let a manufacturer ask the state to accept an equivalent open standard. <strong>Nobody has ever asked.</strong> The rules and the empty list are in the appendix.</li>
</ul>
<footer>grid-coordination.energy<span class="who">DC Jackson</span></footer>

<h3 id="the-two-objections-i-take-seriously">THE TWO OBJECTIONS I TAKE SERIOUSLY</h3>
<h2 id="obsolescence-and-the-patch-obligation">Obsolescence, and the patch obligation</h2>
<ul>
<li><strong>The obsolescence argument still holds, and it is the strongest part of the 2013 case.</strong> A water heater lasts twelve to fifteen years and home networking does not stand still for twelve to fifteen years. Putting the radio in a replaceable module is the textbook answer to a component whose lifetime is shorter than its host's.</li>
<li><strong>The answer is that the replaceable part got smaller and cheaper.</strong><br />The USB-C host port is the replaceable radio, at $4.76 for an adapter instead of a $100 module, and a configurable server address is the replaceable cloud. <strong>What has to survive fifteen years is a URL and an HTTPS client, not a radio.</strong></li>
<li><strong>The cost objection I take seriously is not the silicon.</strong><br />It is that a client in the appliance is a fifteen-year patch obligation on a company whose service organization exists to replace anodes.</li>
<li><strong>The answer is that the obligation already exists.</strong><br />The manufacturer accepted it the moment it shipped a cloud-connected model, and a second, open client on the same stack does not double it.</li>
</ul>

<h3 id="connectivity-which-is-its-own-subject">Connectivity, which is its own subject</h3>
<h2 id="a-utility-measured-the-radio-problem">A utility measured the radio problem</h2>
<div class="columns">
<div>
<ul>
<li><strong>Garage, basement, utility closet, behind the furnace.</strong><br />Concrete, ductwork, and the far end of the house from the router.</li>
<li><strong>PGE, to the Oregon PUC, on its own water heater DR pilot:</strong> &quot;cell-enabled switches have a higher connectivity rate (<strong>79% season average</strong>) than wi-fi connected switches (<strong>50% season average</strong>)... showing constant signal degradation.&quot;</li>
<li><strong>PGE stopped retrofitting water heaters with Wi-Fi in October 2019.</strong> Those were retrofit switches, not CTA-2045 modules. Same radio, same basement.</li>
<li><strong>An SSID or password change disconnects the module silently</strong>, and nobody notices, because nothing else stops working.</li>
<li><strong>The remedy is boring: Ethernet.</strong><br />Water heaters are not mobile. Incentivize a drop at installation and require one near high-amperage outlets in code. <strong>A USB-C Ethernet adapter is $4.76.</strong></li>
</ul>
</div>
<div>
<p><img src="images/wh-after.jpg" alt="" style="height:230px;" /></p>
<div class="ask">
<p><strong>93% of US households have an Internet subscription. Only 76.5% have fixed broadband</strong> (ACS 2024, table B28002). For an appliance joining a home network, 76.5% is the figure that applies. Equity gaps belong in assistance programs, as with electric service.</p>
</div>
</div>
</div>

<h3 id="public-retail-listings-checked-august-31-2026">PUBLIC RETAIL LISTINGS, CHECKED AUGUST 31, 2026</h3>
<h2 id="what-a-module-costs-and-what-a-program-pays">What a module costs, and what a program pays</h2>
<table>
<thead>
<tr>
<th>Listing</th>
<th>Price</th>
<th>What recurs</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Modbus / Ethernet UCM</strong></td>
<td><strong>$169</strong></td>
<td>None listed</td>
</tr>
<tr>
<td><strong>Wi-Fi UCM</strong></td>
<td><strong>$209</strong></td>
<td>A platform fee, prepaid for a year at checkout: <strong>$209 list, $221 in the cart</strong></td>
</tr>
<tr>
<td><strong>Cellular UCM</strong></td>
<td><strong>$249.99</strong></td>
<td>The page states &quot;Price for 1-20 modules is $249/unit, <strong>plus $36 annual Platform Fee</strong>&quot;</td>
</tr>
<tr>
<td><strong>A.O. Smith EcoPort communications package</strong></td>
<td><strong>$349</strong></td>
<td>Cellular</td>
</tr>
</tbody>
</table>
<div class="cap">
<p><strong>These are small-quantity retail listings. Program operators, not customers, buy these modules, and they buy at volume.</strong> <strong>The working assumption in this deck is roughly $100 a unit for Wi-Fi or Ethernet and roughly $150 for cellular</strong>, stated as an assumption because no volume price list is public. The retail figures above are the upper bound. In a program the customer often pays nothing: Puget Sound Energy gives the module away from the PSE Marketplace and adds a $20 installation incentive. <strong>That is a real answer to the price objection, and it does not remove the cost. It moves it to the program budget, where it competes with every other measure for the same dollars.</strong></p>
<p><strong>The recurring fee is the part that has no equivalent in firmware.</strong><br />A client in the appliance reuses the radio, the TLS stack and the credential store the customer already paid for, and carries no annual platform fee at all. <strong>These are public store prices, so they are what a homeowner would pay, not what a program pays.</strong></p>
</div>

<h3 id="interface-a-in-detail">INTERFACE A, IN DETAIL</h3>
<h2 id="what-the-client-actually-has-to-implement">What the client actually has to implement</h2>
<ul>
<li><strong>Transport and identity.</strong><br />HTTPS over TLS, JSON payloads, OAuth 2 client credentials for the token. <strong>Explicitly not PKI:</strong> provisioning X.509 certificates into consumer devices is &quot;daunting at best, or simply not supportable.&quot;</li>
<li><strong>A price-consuming client is a token fetch and two authenticated GETs</strong>, <code>/programs</code> and <code>/events</code>, or MQTT push where the appliance sits behind a home router. <strong>A server offering only public tariff information may accept unauthenticated requests, so all the tank holds is a URL.</strong></li>
<li><strong>That the owner can change it is already a normative MUST.</strong><br />Verbatim: &quot;A VEN MUST support end-user configuration of: VTN URL, clientID and clientSecret... but MUST support end-user reconfiguration.&quot; <strong>The rule's job is to make an existing MUST testable</strong>, not to invent a new requirement.</li>
<li><strong>A price is not a number, it is a schedule.</strong><br />A start, an ISO 8601 duration, and an ordered list of intervals: a day ahead in one object.</li>
<li><strong>The specification names this appliance.</strong><br />Verbatim: &quot;VENs may be implemented within on-site customer devices such as <strong>a water heater</strong>...&quot;</li>
<li><strong>What the appliance already has, and does not buy twice:</strong> the microcontroller, the TLS stack, the JSON parser and the credential store, all shipped the moment the manufacturer added its own cloud client. <strong>The cost that does not amortize is support: a patch obligation for the life of the product.</strong></li>
</ul>
<div class="cap">
<p>Both quotations are verbatim. The appliance is a VEN in OpenADR terms; the demand response provider runs the VTN.</p>
</div>

<h3 id="the-drafting-language">THE DRAFTING LANGUAGE</h3>
<h2 id="six-requirements-as-rule-text">Six requirements, as rule text</h2>
<table>
<thead>
<tr>
<th>Write this, in the rule</th>
<th>Not this</th>
</tr>
</thead>
<tbody>
<tr>
<td>The water heater shall receive a price with a forward schedule over an open protocol, <strong>implemented in the appliance itself</strong></td>
<td>&quot;Shall have a modular demand response communications port compliant with [named standard, named edition]&quot;</td>
</tr>
<tr>
<td>The server address shall be configurable by the owner <strong>without the manufacturer's participation</strong></td>
<td>&quot;The manufacturer shall provide a demand response interface&quot;</td>
</tr>
<tr>
<td>The appliance shall retain and act on the last received schedule <strong>with no network connection</strong></td>
<td>Nothing, which is what every one of these rules currently says about outages</td>
</tr>
<tr>
<td>The appliance shall expose <strong>both the water-heater-specific and the generic energy-management</strong> semantics on the home network</td>
<td>&quot;Shall support [a smart home standard]&quot;</td>
</tr>
<tr>
<td>At least one integrated network interface, <strong>plus a USB-C host port accepting a class-compliant network adapter</strong></td>
<td>&quot;One or more network interfaces&quot;</td>
</tr>
<tr>
<td>A customer may take the signal directly, <strong>with no enrollment and no intermediary</strong></td>
<td>&quot;Customers participate through a program administrator&quot;</td>
</tr>
</tbody>
</table>
<div class="cap">
<p><strong>ENERGY STAR already built the alternative door.</strong><br />Residential Water Heaters Version 5.0, effective April 18, 2023, section 4.D.a: the connected product &quot;shall meet the communication and equipment performance standards for <strong>CTA-2045 or OpenADR 2.0b (Virtual End Node), or both</strong>.&quot; An open-protocol client in the appliance has been an accepted alternative for three years. <strong>The version named is a cloud-to-cloud protocol that was never designed to live in an appliance, so the door was open onto a wall.</strong></p>
</div>
<div class="cap">
<p><strong>The equivalency route, verbatim.</strong><br />WAC 194-24-180(3) and OAR 330-092-0020(16)(b) both direct the department, <strong>on written request by a manufacturer</strong>, to determine whether an alternative standard that is &quot;open and widely available&quot; is equivalent, and to publish any it accepts. Oregon's rule adds that it encourages manufacturers to ask other states too. <strong>Neither department has published a determination. That list is empty.</strong></p>
</div>
<footer>grid-coordination.energy<span class="who">DC Jackson</span></footer>

<h2 id="cta-2045-does-carry-a-price-the-gap-is-above-the-module">CTA-2045 does carry a price. The gap is above the module.</h2>
<ul>
<li><strong>What is true:</strong> price has been in CTA-2045 since the first edition. Present Relative Price and Next Relative Price, a Set/Get Energy Price message with an absolute price, an ISO currency code, a decimal field, an expiry and a next price. <strong>CTA-2045-B Level 2 requires a day-ahead price schedule: &quot;Prices to Devices - Can accept 64 time/price pairs for 24 hour ahead smart planning.&quot;</strong> The committee added time-price pairs for CA Title 24 JA13, then deliberately skipped time-of-use to aim at real-time dynamic pricing. <strong>60 of the 62 certified EcoPort products are Level 2.</strong> This is not a paper feature.</li>
<li><strong>What is missing:</strong> the price object exists in the message set, and <strong>there is no standardized way for a real tariff to reach it</strong>, because the link above the module is undefined. The schedule is 64 points over 24 hours, so it is a day-ahead schedule rather than a live price. And which price arrives, and from whom, is decided by whichever cloud the module vendor runs.</li>
</ul>
<div class="cap">
<p>The quoted feature list is the OpenADR Alliance's own: <strong>CTA-2045-B Level 2 Guidance for Water Heater OEMs</strong>, section 6, time price pairs. Level 2 count from the EcoPort certified product database, counted August 31, 2026.</p>
</div>

<h3 id="the-next-edition">THE NEXT EDITION</h3>
<h2 id="cta-2045-c-is-a-live-project-not-yet-a-document">CTA-2045-C is a live project, not yet a document</h2>
<ul>
<li><strong>The project is real.</strong><br />CTA's R7.8 subcommittee launched CTA-2045-C in January 2025, to &quot;provide improvements to the standard interface for energy management signals and messages to reach devices.&quot; CTA-2045.4, an implementation guide, is also active.</li>
<li><strong>Nineteen months on, both are still listed under Active Projects. Nothing is published.</strong> Nineteen months is not slow for a standards project. It is normal, and the people doing it are volunteers.</li>
<li><strong>Its announced scope is improvements to the same socket-side interface.</strong><br />It says nothing about the link above the module.</li>
<li><strong>A rule can only be written against a published document.</strong><br />What -C will contain, beyond its published scope statement, is not yet knowable.</li>
</ul>
<div class="cap">
<p>CTA standards news, <strong>&quot;CTA Launched Project CTA-2045-C, Modular Communications Interface for Energy Management,&quot;</strong> January 2025. Both CTA-2045-C and CTA-2045.4 still appear under Active Projects on CTA's current projects page, checked August 31, 2026.</p>
</div>

<h3 id="ahri-1430">AHRI 1430</h3>
<h2 id="it-closes-the-behavior-gap-not-the-reach-gap">It closes the behavior gap, not the reach gap</h2>
<ul>
<li><strong>What it is, stated fairly.</strong><br />AHRI 1430-2022 builds on CTA-2045 rather than replacing it. It adds test procedures, conformance conditions and appliance behavior requirements above the message set. Colorado and New York name it; Rheem's compliance bulletin treats the three as one family, &quot;ANSI/CTA-2045-A, ANSI/CTA-2045-B or AHRI 1430.&quot;</li>
<li><strong>It fixes something real, and something CTA-2045 left open on purpose.</strong><br />NEEA: within CTA-2045 &quot;the lack of descriptive SGD behavior in response to messaging was intentional,&quot; so two compliant water heaters could answer the same Shed request differently. 1430 constrains that. <strong>It is a genuine improvement and I am not arguing against it.</strong></li>
<li><strong>It does not change what is on the other side of the socket.</strong><br />A 1430-compliant water heater still has a port and no radio. The customer still buys a module, installs it and joins it to Wi-Fi. <strong>Nothing above the module is standardized by either document.</strong></li>
<li><strong>So it makes the appliance behave predictably once something is talking to it.</strong> It does not make anything talk to it, and it does not let the customer choose who does.</li>
</ul>
<div class="cap">
<p>The same is true of any future edition. <strong>Testing behavior below the socket and defining reach above it are different problems</strong>, and only the first one is being worked.</p>
</div>

<h2 id="the-same-proposal-on-a-cec-docket-in-2024">The same proposal, on a CEC docket in 2024</h2>
<ul>
<li><strong>The failure mode was named then, not in hindsight.</strong><br />A 2024 response in <strong>CEC Docket 24-FDAS-03</strong> put it in a footnote: CTA-2045 &quot;hasn't been an unqualified success,&quot; and &quot;its dependence on aftermarket, costly UCMs has posed significant obstacles to widespread use and adoption.&quot;</li>
<li><strong>So was the fix, including the protocol.</strong><br />Same footnote: &quot;The solution is to mandate the control and status-reporting capabilities (defined first by CTA-2045) into modern open standard protocols (e.g. OpenADR3) that can be incorporated into the integrated network interfaces (especially Wi-Fi) that new water-heaters typically provide.&quot;</li>
<li><strong>What has changed since is the evidence, not the argument.</strong><br />Two more model years, four jurisdictions still, and the participation record in these exhibits.</li>
</ul>
<div class="cap">
<p>Public, and still on the docket. <strong>The ask in this deck is two years old, and nothing since has cut against it.</strong></p>
</div>

<h3 id="the-objection">THE OBJECTION</h3>
<h2 id="you-are-trading-a-tested-standard-for-an-untested-one">&quot;You are trading a tested standard for an untested one&quot;</h2>
<ul>
<li><strong>The concession, first and without hedging.</strong><br />The Matter energy clusters are largely specification today, with little shipping product behind them. Water Heater Management arrived with Matter 1.4. <strong>That part of the objection is correct.</strong></li>
<li><strong>The two gaps are not the same kind.</strong><br />CTA-2045's gap is structural: the premise requires a module market, and thirteen years and four mandates produced <strong>four modules from three vendors against fifty-eight certified appliances</strong>. Matter's gap is maturity in a platform whose owners have already committed: Apple, Google, Amazon, Samsung, LG and roughly 400 member companies.</li>
<li><strong>This industry has already made exactly this bet, in the other direction.</strong> Washington made the socket law for units manufactured on or after <strong>January 1, 2021</strong>. The first EcoPort certified products were announced <strong>October 26, 2022</strong>: the socket was law twenty-two months before there was a way to certify a product against it.</li>
<li><strong>And half the ask does not depend on any of this.</strong><br />OpenADR 3 is HTTPS, TLS, JSON and OAuth 2, already running in every water heater that talks to its manufacturer's cloud. That half is available now, with no ecosystem required. The half still arriving only adds.</li>
</ul>
<div class="cap">
<p><strong>A known failure is not the safer bet against an uncertain one.</strong><br />And a profile that moves can be met with a firmware update; a port that was the wrong bet cannot.</p>
</div>

<h3 id="the-mandate-record">The mandate record</h3>
<h2 id="four-jurisdictions-instrument-by-instrument">Four jurisdictions, instrument by instrument</h2>
<table>
<thead>
<tr>
<th>Jurisdiction</th>
<th>The instrument</th>
<th>What it requires</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Washington</strong></td>
<td>RCW 19.260.080; <strong>WAC 194-24-180</strong></td>
<td>Sale prohibited without a CTA-2045 port. Statute says on or after Jan 1, 2021; the rule applies from <strong>Jan 1, 2023</strong>. Since March 2026 the rule accepts <strong>-A or -B</strong></td>
</tr>
<tr>
<td><strong>Oregon</strong></td>
<td><strong>OAR 330-092-0015(16)</strong> and <strong>-0020(16)</strong></td>
<td>Sale prohibited without a CTA-2045-A port, units manufactured on or after <strong>July 1, 2023</strong>. HB 2062 said Jan 1, 2022; ODOE postponed twice, and called the second the last one it could grant administratively</td>
</tr>
<tr>
<td><strong>Colorado</strong></td>
<td><strong>C.R.S. 6-7.5-105(5)(d)</strong>, added by HB23-1161</td>
<td>Sale or lease prohibited on and after <strong>Jan 1, 2026</strong> without a port compliant with <strong>AHRI 1430</strong>. 40 to 120 gallons, 12 kW or less</td>
</tr>
<tr>
<td><strong>New York</strong></td>
<td><strong>2025 ECCCNYS</strong> R403.5.4 and C404.8</td>
<td>Not a sales rule. <strong>A building energy code requirement, enforced at permit</strong>, effective <strong>Dec 31, 2025</strong>. Units manufactured on or after July 1, 2025 must meet <strong>AHRI 1430</strong></td>
</tr>
</tbody>
</table>
<div class="cap">
<p><strong>Three prohibit the sale. One binds the builder at permit</strong>, which is why Rheem's September 2025 compliance bulletin lists Colorado, Oregon and Washington, not New York. <strong>Colorado and New York name AHRI 1430, which is not a move away from CTA-2045.</strong> AHRI 1430-2022 builds on it: the standard's stated purpose is to confirm that equipment communicates &quot;using CTA-2045-B&quot;, and it adds the test procedures and appliance behavior requirements that CTA-2045 deliberately left to the manufacturer. Rheem's compliance bulletin treats them as one family: &quot;ANSI/CTA-2045-A, ANSI/CTA-2045-B or AHRI 1430&quot;.</p>
<p><strong>Credit where it is due:</strong> four jurisdictions did the genuinely hard work of writing an appliance rule and defending it. That is more than most states have managed on any flexible demand question.</p>
</div>

<h3 id="the-ecoport-certified-product-database-counted-august-31-2026">THE ECOPORT CERTIFIED PRODUCT DATABASE, COUNTED AUGUST 31, 2026</h3>
<h2 id="58-appliances-4-modules">58 appliances. 4 modules.</h2>
<ul>
<li><strong>62 certified listings.</strong> 58 Smart Grid Devices, mostly heat pump water heaters. <strong>4 Universal Communication Modules</strong>, from Steffes, e-Radio and SkyCentrics. 60 of the 62 are certified at CTA-2045-B Level 2.</li>
<li><strong>Certification is voluntary and no mandate requires it</strong>, so 62 is a floor, not a census. It is the only public count there is.</li>
<li><strong>The premise was consumer choice</strong>: the customer selects a module suited to their home. After thirteen years and four mandates, that is what there is to select from. Three vendors built for a market of four states with no committed volume.</li>
<li><strong>Each module terminates in its own vendor's head end.</strong><br />Steffes into the Steffes head end, e-Radio into e-Radio's cloud, SkyCentrics into SkyCentrics' platform. <strong>Two compliant water heaters with modules from different vendors are not reachable by the same demand response provider.</strong></li>
</ul>

<h3 id="participation">PARTICIPATION</h3>
<h2 id="the-five-records-with-sources">The five records, with sources</h2>
<div class="cap" style="margin-top:0">
<p><strong>No published rate exists.</strong><br />Not at NEEA, BPA, EPRI, PNNL, DOE, the Oregon PUC, the Washington UTC, EIA, AHRI, or the Alliance's own product database.</p>
</div>
<table>
<thead>
<tr>
<th>Source</th>
<th>What it says</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Form EIA-861, Schedule 6, line 7</strong></td>
<td><strong>No utility in Washington, Oregon or New York reported adding one</strong>, in any year 2020 through 2024. Some entered zero, most left the field blank. PSE reports 601,946 residential DR customers and leaves the field blank; PGE reports 192,617 and leaves it blank. Colorado's entries are essentially all Fort Collins, and not CTA-2045</td>
</tr>
<tr>
<td><strong>Portland General Electric</strong>, Oregon PUC, April 2022</td>
<td>&quot;the pilot has deployed <strong>11,703 water heater retrofit switches and 39 CTA-2045 enabled</strong> new Smart Water Heaters communication devices&quot;</td>
</tr>
<tr>
<td><strong>PGE again</strong>, June 2023</td>
<td>Closed the pilot to new enrollments and extended it two years, to allow &quot;increasing availability of CTA-2045 enabled water-heaters so PGE can resume installations.&quot; <strong>PGE paused installations and waited for certified equipment to exist</strong></td>
</tr>
<tr>
<td><strong>Puget Sound Energy</strong>, 2025 DR Equity Action Plan</td>
<td>Washington's largest utility launched its first water heater DR product in <strong>Q2 2025</strong>, at ordinary first-year pilot scale, <strong>2,000 units</strong>, the module free from the PSE Marketplace and a $20 installation incentive</td>
</tr>
<tr>
<td><strong>AHRI shipment statistics</strong></td>
<td>About <strong>5 million</strong> residential electric storage water heaters shipped in the US in each of 2023, 2024 and 2025</td>
</tr>
</tbody>
</table>
<div class="cap">
<p><strong>Line 7 is annual additions, not stock, and not CTA-2045 specifically.</strong><br />A floor, not a census.</p>
<p><strong>Five independent sources point one way and none points the other.</strong><br />Against roughly five million units a year, the connected count is not one percent, and not a tenth of one percent. <strong>If it were otherwise, one of these five would show it.</strong></p>
</div>

<h3 id="cta-2045">CTA-2045</h3>
<h2 id="every-date-that-matters">Every date that matters</h2>
<table>
<thead>
<tr>
<th></th>
<th></th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>2013</strong></td>
<td>ANSI/CEA-2045, published by the Consumer Electronics Association with the Smart Grid Interoperability Panel</td>
</tr>
<tr>
<td><strong>March 2018</strong></td>
<td><strong>ANSI/CTA-2045-A.</strong> The edition Washington's statute and Oregon's rule name</td>
</tr>
<tr>
<td><strong>September 2019</strong></td>
<td><strong>ANSI/CTA-2045-B</strong>, ANSI version February 2021. Still the current published edition</td>
</tr>
<tr>
<td><strong>January 1, 2021</strong></td>
<td>Washington's statutory date. Commerce is authorized to set a later one, and does</td>
</tr>
<tr>
<td><strong>October 26, 2022</strong></td>
<td>The OpenADR Alliance announces the <strong>first EcoPort certified products</strong>. Twenty-two months after the date Washington's statute named</td>
</tr>
<tr>
<td><strong>January 1, 2023</strong></td>
<td>Washington's rule, WAC 194-24-180, actually applies. Commerce delayed it two years, for supply chain</td>
</tr>
<tr>
<td><strong>January 2025</strong></td>
<td>CTA-2045-C project launched. Nineteen months later, nothing published</td>
</tr>
</tbody>
</table>
<div class="cap">
<p><strong>The socket was written into law before there was a way to certify it.</strong><br />Washington's statute named 2021; the first certifications came in October 2022, and Commerce had by then moved the operative date to 2023. The certification program ran about two years behind the Alliance's own published schedule.</p>
<p><strong>Federal: nothing.</strong><br />S.4061 and H.R.7962 would have had DOE decide by December 31, 2024 whether to require demand response capability on electric storage water heaters. Both died in committee. <strong>DOE has never been asked the question.</strong></p>
</div>

<h3 id="what-carries-over-when-the-socket-retires">WHAT CARRIES OVER WHEN THE SOCKET RETIRES</h3>
<h2 id="the-semantics-are-already-expressible-somewhere-else">The semantics are already expressible somewhere else</h2>
<ul>
<li><strong>The other standard's own text says so.</strong><br />OpenADR 3 User Guide, section 8.11: &quot;OpenADR 3 is well suited to be a standard external protocol for CTA-2045B... For many capabilities of CTA-2045, e.g. sending prices, an emergency signal, or reporting energy use, there are existing mechanisms in OpenADR that implement the functionality. For a few capabilities, enumeration values specific to CTA-2045 have been added.&quot;</li>
<li><strong>Those enumerations are in the payload registry</strong>, <code>CTA2045_REBOOT</code> and <code>CTA2045_SET_OVERRIDE_STATUS</code>, both pass-through for resources that support CTA-2045-B, and the user guide says a document giving an unambiguous mapping between the two standards is forthcoming. <strong>Retiring the socket delivers the same semantics without the $209 part.</strong></li>
</ul>

<h2 id="the-same-rule-text-as-bench-tests">The same rule text, as bench tests</h2>
<div class="cap" style="margin-top:0">
<p><strong>A capability nobody can test is a capability nobody will adopt.</strong><br />Appliance rules run on test methods. Each line below is measurable on a bench in an afternoon, with no help from the manufacturer, and every one of them is something Washington's current rule explicitly does not do.</p>
</div>
<table>
<thead>
<tr>
<th>Capability</th>
<th>What the lab measures</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Open protocol in the appliance</strong></td>
<td>Point the water heater at a reference server on the bench. It connects and acts, with the manufacturer's cloud unreachable</td>
</tr>
<tr>
<td><strong>Customer-configurable server</strong></td>
<td>Change the server address using only the appliance's own interface, with no vendor account and no vendor app. Time it</td>
</tr>
<tr>
<td><strong>The price is consumed</strong></td>
<td>Publish a day-ahead price schedule. Observe the heating decision change</td>
</tr>
<tr>
<td><strong>Local survival</strong></td>
<td>Deliver a schedule, then cut the WAN. The tank keeps acting on the retained schedule for the full horizon</td>
</tr>
<tr>
<td><strong>Network interfaces</strong></td>
<td>Present Ethernet, Wi-Fi and cellular in turn, integrated or over USB-C. Each reaches the configured server</td>
</tr>
<tr>
<td><strong>No enrollment</strong></td>
<td>Connect to a reference server with no account creation, no program enrollment and no intermediary. It receives and acts</td>
</tr>
</tbody>
</table>

<h3 id="matter-interface-b">MATTER, INTERFACE B</h3>
<h2 id="the-water-heater-clusters-by-name-and-by-content">The water heater clusters, by name and by content</h2>
<ul>
<li><strong>Water Heater Management, 0x0094, revision 2.</strong> Read <code>HeaterTypes</code> (immersion element 1, immersion element 2, heat pump, boiler, other), <code>HeatDemand</code> (which is firing now), <code>BoostState</code>, and with the optional EnergyManagement feature <code>TankVolume</code>, <code>EstimatedHeatRequired</code> in mWh and <code>TankPercentage</code>. Commands: <code>Boost</code> (duration, one-shot, emergency, temporary setpoint, target percentage, target reheat percentage) and <code>CancelBoost</code>. Events: <code>BoostStarted</code>, <code>BoostEnded</code>.</li>
<li><strong>Water Heater Mode, 0x009E.</strong> <code>SupportedModes</code> and a read/write <code>CurrentMode</code>, from mode tags including Auto, Quick, LowEnergy, Vacation, Off, Manual, Timed. <code>StartUpMode</code>, <code>OnMode</code> and the OnOff dependency are explicitly disallowed.</li>
<li><strong>A controller can see how hot the tank is</strong>, how much energy reheating would take, which element is firing, and can set the mode or call for a bounded boost with a temperature and a target fill.</li>
<li><strong>Released in Matter 1.4, November 2024: non-provisional and certifiable today.</strong> I could not establish that a Matter-certified water heater is shipping. <strong>If anyone here has certified one, I would like to know.</strong></li>
</ul>

<h3 id="matter-interface-b-1">MATTER, INTERFACE B</h3>
<h2 id="the-energy-clusters-and-why-both-families-are-needed">The energy clusters, and why both families are needed</h2>
<ul>
<li><strong>Device Energy Management, 0x0098, and DEM Mode.</strong><br />The appliance publishes a <code>Forecast</code> and the manager reshapes it: <code>PowerAdjustRequest</code>, <code>StartTimeAdjustRequest</code>, <code>ModifyForecastRequest</code>, <code>PauseRequest</code>, <code>ResumeRequest</code>. <code>ESAType</code> value 2 is <code>WaterHeating</code>, alongside EVSE, space heating, battery storage, solar and pool pumps. <strong>One data model types the whole house.</strong></li>
<li><strong>Neither cluster family is sufficient alone.</strong><br />Water Heater Management without DEM gives a manager appliance controls and no way to negotiate a plan against a price. DEM without Water Heater Management gives it energy semantics and no idea what a tank is.</li>
<li><strong>Consent is recorded per adjustment.</strong><br />Every DEM adjustment records whether the house or the grid asked for it, so the customer can refuse grid-driven optimization and keep local optimization, and that setting has no network write access at all.</li>
<li><strong>Matter is local by construction:</strong> there is no cloud-mediated Matter, so this is a home-network capability and cannot cross the grid boundary by itself. <strong>Matter 1.5, November 2025, added an electrical energy tariff device type</strong>, so Matter has somewhere to put a price and still no way to fetch one from the grid. <strong>Something in the house still has to hold the grid connection.</strong></li>
</ul>

<h3 id="what-the-radio-costs-once-the-client-is-in-the-appliance">WHAT THE RADIO COSTS ONCE THE CLIENT IS IN THE APPLIANCE</h3>
<h2 id="three-interfaces-three-listings-one-port">Three interfaces, three listings, one port</h2>
<div class="columns3">
<div>
<p><img src="images/Ethernet-dongle-crop.png" alt="" style="width:340px;" /></p>
</div>
<div>
<p><img src="images/LTE-dongle-crop.png" alt="" style="width:340px;" /></p>
</div>
<div>
<p><img src="images/WiFi-dongle-crop.png" alt="" style="width:340px;" /></p>
</div>
</div>
<div class="cap">
<p>Left to right: a USB-C to Gigabit Ethernet adapter at <strong>$15.19</strong>, an unlocked 4G LTE modem with a SIM slot at <strong>$39.99</strong>, and a USB Wi-Fi adapter at <strong>$11.99</strong>. All three are class-compliant retail listings and all three plug into the same port. The cheapest Ethernet adapter is <strong>$4.76</strong>.</p>
</div>
<div class="ask">
<p><strong>The requirement was never a bill of materials.</strong><br />At least one integrated network interface, plus a USB-C host port that accepts a class-compliant adapter, and whoever needs that basement online supplies the adapter. <strong>This is not a like-for-like comparison:</strong> a module price includes a cloud service, a certification and a support relationship, and a dongle is cheap precisely because the appliance supplies the client. <strong>Move the client, and the radio becomes a commodity.</strong> For scale, the Wi-Fi module is $209 and the cellular module $249 plus a $36 annual platform fee.</p>
</div>
