section {

section.dark  { background: var(--ink); color: #EEF1F4; }

section.dark table th { color: #9BAAB6; border-bottom-color: #6E8090 !important; }

h1 { font-size: 56px; font-weight: 600; letter-spacing: -1.5px; line-height: 1.06; color: var(--ink); margin: 0 0 .3em; }
h2 { font-size: 37px; font-weight: 600; letter-spacing: -0.8px; line-height: 1.12; color: var(--ink); margin: 0 0 .55em; }

strong { font-weight: 600; color: var(--ink); }
em { font-style: normal; color: var(--muted); }
a { color: var(--green); text-decoration: none; border-bottom: 1px solid rgba(42,110,63,.35); }
.cap a, .band a { color: var(--green); }

section ul { list-style: none; padding-left: 0; margin: 0; }
section li { padding: 13px 0; border-top: 1px solid var(--hair); }
section li:last-child { border-bottom: 1px solid var(--hair); }
section ol { padding-left: 0; margin: 0; counter-reset: t; list-style: none; }
section ol li { padding: 12px 0 12px 52px; position: relative; }

<h2 id="one-signal-cannot-do-both-jobs">One signal cannot do both jobs</h2>
<table>
<thead>
<tr>
<th></th>
<th>A dynamic price</th>
<th>A per-customer power limit</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>What it is</strong></td>
<td>What energy costs right now</td>
<td>How much power this connection may draw right now</td>
</tr>
<tr>
<td><strong>What it protects</strong></td>
<td>Statewide supply and demand</td>
<td>The physical limit of one wire</td>
</tr>
<tr>
<td><strong>What it does</strong></td>
<td>Moves energy across time</td>
<td>Moves nothing. Caps power, immediately</td>
</tr>
<tr>
<td><strong>Without it</strong></td>
<td>Nobody has a reason to shift</td>
<td>Nothing stops everyone shifting at once</td>
</tr>
</tbody>
</table>
<div class="cap">
<p>Everyone in this room already lives with a power limit: it is the main breaker in your garage, and nobody has ever called it tyranny. The transformer on your street is the same device one size up, shared with five or six neighbors, except it has no breaker. It just cooks quietly for years, and then fails on the hottest day.</p>
</div>

<h2 id="six-tests-for-any-flexibility-proposal">Six tests for any flexibility proposal</h2>
<div class="cap" style="margin-top:0">
<p>Rate designs, appliance standards, virtual power plant programs, capacity and interconnection proposals. Every one of them will use the words <em>flexible</em>, <em>smart</em>, and <em>customer choice</em>. <strong>Many of them also insert a new gatekeeper between the grid and the customer.</strong></p>
</div>
<ol>
<li>Does the grid send the home <strong>an objective</strong>, or does it <strong>operate the appliance</strong>?</li>
<li>Does the open interface reach <strong>the appliance itself</strong>, or stop at <strong>the manufacturer's cloud</strong>?</li>
<li>Can the customer <strong>point the appliance at a server of their own choosing</strong>?</li>
<li>Can the customer take the signal <strong>directly from their utility</strong>, or is a <strong>middleman required</strong>?</li>
<li>Does the limit <strong>hold at the customer's connection</strong>, when the internet does not?</li>
<li>Does the customer <strong>who cannot respond</strong> end up better off, or worse?</li>
</ol>
<footer>grid-coordination.energy<span class="who">DC Jackson</span></footer>

<h2 id="test-5-a-bound-not-a-hope">Test 5: a bound, not a hope</h2>
<div class="columns">
<div class="band">
<h4 id="advisory-to-the-home">Advisory to the home</h4>
<p>Sent ahead, with a forward view, so the house can plan: pre-heat the tank, stage the car, surprise nobody.</p>
</div>
<div class="bandc">
<h4 id="enforced-at-the-connection">Enforced at the connection</h4>
<p>So it binds. A planner can count it, rather than hoping enough customers respond.</p>
</div>
</div>
<ul>
<li><strong>One customer, one connection, one limit</strong> (import and export). A modern home has solar, a battery, one or two car chargers, a heat pump and a heat pump water heater, all at once. The limit belongs on the wire, not on any one appliance.</li>
<li><strong>It must survive the network.</strong> A home that already has today's prices and today's limit keeps behaving correctly with no connection at all.</li>
</ul>
<div class="pf">
<p><span class="p">PASSES</span> a limit for the whole service connection, retained and acted on locally.<br />
<span class="f">FAILS</span> a rule written for one device category that ignores the other five in the same house.</p>
</div>

<h2 id="test-6-the-customer-who-cannot-respond">Test 6: the customer who cannot respond</h2>
<div class="cap" style="margin-top:0">
<p>The first objection to hourly prices and per-customer limits is that the affluent optimize and everybody else gets rationed. It is the right question and it deserves the first answer, not the last.</p>
</div>
<table>
<thead>
<tr>
<th></th>
<th>To join a program today</th>
<th>To read a public signal</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>An enrollment</strong></td>
<td>Required</td>
<td>Nothing</td>
</tr>
<tr>
<td><strong>A credit relationship with a third party</strong></td>
<td>Required</td>
<td>Nothing</td>
</tr>
<tr>
<td><strong>A particular brand of device</strong></td>
<td>Usually</td>
<td>Any device that can reach the network</td>
</tr>
</tbody>
</table>
<ul>
<li><strong>Nobody should have to watch a price.</strong> The appliance watches the price. The customer sets a preference once.</li>
<li><strong>The customers who cannot shift are paying today</strong> for a grid sized to everyone else's worst hour. Capital spending that never enters rates is their benefit, and it is the largest one.</li>
</ul>

<h2 id="the-same-house-with-the-door-open">The same house, with the door open</h2>
<p><img src="images/cpuc/proposed.svg" alt="" style="width:800px;" /></p>
<div class="cap">
<p><strong>Half of this is already running.</strong> A <a href="https://github.com/grid-coordination/price-server-user-guide">free, public server</a> carries real hourly California prices and grid emissions on an open standard, and <a href="https://github.com/grid-coordination/openadr3-ven-hass">free open-source home automation software</a> receives it and orchestrates the household's loads against it. No account, no contract, no enrollment. <a href="https://www.canarymedia.com/articles/utilities/as-californians-electrify-tech-prevent-grid-overload">PG&amp;E is piloting the other half with AMI 2.0</a> (HomeBoost and PanelBoost).</p>
</div>

<h2 id="what-not-to-mandate">What not to mandate</h2>
<table>
<thead>
<tr>
<th>If the rule says</th>
<th>What you will actually get</th>
</tr>
</thead>
<tbody>
<tr>
<td>&quot;Must support [named standard, 2019 edition]&quot;</td>
<td>Compliance frozen at the state of the art in 2019, and a vendor incentive to do nothing further</td>
</tr>
<tr>
<td>&quot;The manufacturer shall provide a grid interface&quot;</td>
<td>A cloud interface. The appliance still speaks nothing open, and it dies when that cloud does</td>
</tr>
<tr>
<td>&quot;Customers participate through a program administrator&quot;</td>
<td>Every customer needs a third party's permission before they can help the grid</td>
</tr>
<tr>
<td>&quot;Each inverter shall be controllable&quot;</td>
<td>Five separate control paths into one house and nobody managing the total</td>
</tr>
<tr>
<td>&quot;The appliance shall run between 9 a.m. and 3 p.m.&quot;</td>
<td>A load shape frozen into regulation. It cannot follow a price, cannot respect a limit, and cannot change when the grid does</td>
</tr>
</tbody>
</table>
<div class="band">
<p><strong>Name the capability in the rule, and the standard in an appendix you can update without reopening the rule.</strong> Write it at the appliance, not at somebody's server.</p>
</div>

<h3 id="pool-controls-adopted-2023-the-first-in-the-nation">Pool controls, adopted 2023, the first in the nation</h3>
<h2 id="the-rule-wrote-the-answer-not-the-capability">The rule wrote the answer, not the capability</h2>
<table>
<thead>
<tr>
<th>The six tests</th>
<th>Pool controls, Title 20 sections 1690 to 1697</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>1. An objective, not operation</strong></td>
<td><strong>No objective is sent at all.</strong> The rule fixes the hours instead: 9 a.m. to 3 p.m., nothing automatic 4 to 9 p.m. (1693(b)(2)(C)(1))</td>
</tr>
<tr>
<td><strong>2. Open to the appliance</strong></td>
<td><strong>Partial.</strong> Open standards are required, for the <strong>consent</strong> functions only (1693(b)(6)(B))</td>
</tr>
<tr>
<td><strong>3. A server the customer chooses</strong></td>
<td><strong>Not addressed</strong></td>
</tr>
<tr>
<td><strong>4. Direct from the utility</strong></td>
<td><strong>Not addressed.</strong> A vendor-exclusive, cloud-only design complies</td>
</tr>
<tr>
<td><strong>5. A limit that holds locally</strong></td>
<td><strong>No limit of any kind</strong>, and no way to receive one</td>
</tr>
<tr>
<td><strong>6. The customer who cannot respond</strong></td>
<td><strong>The only one it answers</strong>, by brute force, while those remain the right hours</td>
</tr>
</tbody>
</table>
<div class="ask">
<p>A fixed clock cannot tell a house importing from a strained grid at 6 p.m. from a house running its pump off its own battery at 6 p.m. <strong>It treats them identically.</strong></p>
</div>
<div class="band">
<p><strong>The three still open have no proposed rule text yet.</strong> That is where to write the capability instead of the clock.</p>
</div>

<h3 id="flexible-demand-appliance-standards">Flexible Demand Appliance Standards</h3>
<h2 id="fdas-should-be-one-standard-for-all-appliances-not-one-per-appliance">FDAS should be one standard for all appliances, not one per appliance</h2>
<div class="ask">
<p>We do not need OCPP for chargers, CTA-2045 for water heaters, AHRI 1380 for HVAC and IEEE 2030.5 for inverters: a protocol per appliance category, and a rulemaking behind each.</p>
</div>
<ul>
<li><strong>Every one of them needs the same two facts, and only those two.</strong> What power costs now and next, and how much this connection may draw. A water heater does not need a water heater vocabulary to know either one.</li>
<li><strong>Grid to house, over the Internet.</strong> One open protocol carrying both, with the server address a setting the customer controls. <strong>OpenADR 3 does this today.</strong></li>
<li><strong>House to appliance, over the home network.</strong> The same two facts to every device in the building, whatever it is. <strong>Matter does this today.</strong></li>
<li><strong>This is less regulation, not more.</strong> One capability written once, instead of a rulemaking per appliance forever, each going stale the day it is printed.</li>
</ul>
<div class="band">
<p>Every appliance in the house is wired to one electrical code. Nobody wrote a separate code for water heaters, and the signals that tell them what to do should arrive the same way.</p>
</div>
<footer>grid-coordination.energy<span class="who">DC Jackson</span></footer>

<h3 id="making-the-price-signal-reach-every-customer">Making the price signal reach every customer</h3>
<h2 id="a-time-of-use-rate-is-a-price-stream-with-fewer-changes">A time-of-use rate is a price stream with fewer changes</h2>
<ul>
<li><strong>The signal carries what power costs now and over the coming hours.</strong> A schedule, not a single number. That forward view is what lets a house plan ahead.</li>
<li><strong>Highly dynamic pricing is the destination, and nothing has to wait for it.</strong> A flat rate is a price stream with no changes at all. Same mechanism, same appliance, same software, whatever tariff the customer is on. The appliance never needs a tariff engine, only an interval consumer.</li>
<li><strong>What that asks of the Commission:</strong> require tariffs to be published in a machine-readable, computable form. The open <strong><a href="https://lfenergy.org/projects/utility-rate-plan-exchange-urpx/">Utility Rate Plan Exchange (URPX)</a></strong> standard, hosted by LF Energy, is built for exactly this.</li>
<li><strong>And what it asks the Commission to retire:</strong> tariff attributes a price stream cannot carry. A <strong>demand charge</strong> is the clearest example: it prices a peak after the fact, so no device can act on it from the signal alone.</li>
</ul>
<div class="band">
<p>Every customer can be served by the same mechanism today, whatever tariff they are on. The rate can get more dynamic later without touching a single appliance.</p>
</div>
<footer>grid-coordination.energy<span class="who">DC Jackson</span></footer>

<h2 id="three-levers-three-proceedings-all-already-open">Three levers, three proceedings, all already open</h2>
<div class="columns3 lever">
<div>
<h4 id="cpuc">CPUC</h4>
<p><span class="do">Attach an open-access condition</span> to the flexible service connection ordered in <strong>D.26-02-025</strong>: the limit must reach the customer in an open, machine-readable form, with no enrollment and no intermediary.</p>
<p><span class="do">Extend the standard offer</span> beyond PG&amp;E and SCE.</p>
<p><span class="do">Require tariffs published machine-readable and computable</span>, so <strong>any</strong> rate becomes a price stream.</p>
</div>
<div>
<h4 id="cec">CEC</h4>
<p><strong>The one adopted standard writes the answer into the rule.</strong> Pool controls must ship a schedule running 9 a.m. to 3 p.m., never automatically 4 p.m. to 9 p.m. Nothing requires them to receive a price, a signal, or a limit over an open protocol, on the Internet or the home network.</p>
<p>Thermostats, EV charging and home batteries are still open. <span class="do">Make tests 2, 3 and 5 explicit</span> there.</p>
</div>
<div>
<h4 id="the-legislature">The Legislature</h4>
<p><strong>AB 1787</strong> is held in Senate Appropriations. It has been carried once, so it can be carried again, and it is one clause short: it gives the customer access to their <strong>data</strong>. Add access to the <span class="do">signals</span>, and the right to point their own equipment at a server of their choosing.</p>
</div>
</div>
<div class="cta">
<p><span class="lbl">The ask</span></p>
<p><strong>None of this needs a new proceeding. It needs one sentence in the ones you already have open.</strong> Tell me which, and I will draft it and file it this month, at no charge.</p>
</div>
<footer>grid-coordination.energy<span class="who">DC Jackson</span></footer>

<h2 id="where-california-actually-stands">Where California actually stands</h2>
<table>
<thead>
<tr>
<th>Driver</th>
<th>Where it stands</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>CalFUSE</strong></td>
<td>CPUC staff framework, June 2022, for a single universally available dynamic price signal. A white paper name, not a decision or a program</td>
</tr>
<tr>
<td><strong>Load Management Standards</strong></td>
<td>Large IOUs: an hourly, marginal cost-based rate for every customer class by January 1, 2027. Large CCAs: that rate or a qualifying program by July 1, 2027</td>
</tr>
<tr>
<td><strong>Rate design</strong></td>
<td>D.25-08-049, August 2025. Guidelines for designing demand flexibility rates; the rates themselves are still in testimony. Remaining issues moved to R.26-04-009, opened April 2026</td>
</tr>
<tr>
<td><strong>Flexible service connections</strong></td>
<td>D.26-02-025, February 10, 2026. PG&amp;E and SCE to establish a standardized tariffed flexible connection. Load behind a certified power control system is excluded from the connected load calculation</td>
</tr>
<tr>
<td><strong>Appliance standards</strong></td>
<td>One adopted: pool controls, September 29, 2025. It mandates a preconfigured schedule (1693(b)(2)(C)(1)) and open standards for the <strong>consent</strong> functions (1693(b)(6)(B)), but no ability to receive a price, a signal or a limit, and no customer-configurable server. Thermostats, EV charging and home batteries are open dockets with no rule text</td>
</tr>
<tr>
<td><strong>Legislation</strong></td>
<td>AB 1787 held under submission in Senate Appropriations, August 13, 2026. The regulators are moving; the statute is not</td>
</tr>
</tbody>
</table>

<h2 id="why-some-standards-are-hurting-not-helping">Why some standards are hurting, not helping</h2>
<ul>
<li><strong>CTA-2045, marketed as EcoPort.</strong> Washington, Oregon, Colorado and New York require the socket on new electric water heaters. Nothing above it was ever standardized, so every vendor's module speaks its own language upstream, and the module a customer has to buy and install runs well over $150. <strong>The open interface stops at the socket. The standard is obsolete and should be retired, not written into new rules.</strong></li>
<li><strong>AHRI 1380.</strong> The standard permits local interfaces over Ethernet or CTA-2045-A. <strong>No shipping product implements either.</strong> Vendors satisfy it by routing the equipment through their own cloud over a private protocol, so it certifies the cloud, not the appliance.</li>
<li><strong>IEEE 2030.5.</strong> Strong at commanding one inverter. But one inverter is the wrong unit for a house with solar, a battery and two bidirectional chargers: control each separately and nobody manages the total. <strong>What belongs there is one import and export limit for the whole connection.</strong></li>
<li><strong>OCPP.</strong> Built for commercial and public EV charging. <strong>Almost no</strong> US residential chargers implement it, and where it is supported the connection is not offered to the customer: it points at the vendor cloud. <strong>There is no need for a protocol unique to EV chargers.</strong></li>
</ul>
<p><strong>Two open standards already support every one of these principles, and both ship today.</strong></p>
<div class="columns">
<div class="band">
<p><strong><a href="https://www.openadr.org/">OpenADR 3</a></strong> carries prices, events and limits from the utility to the customer's own equipment, <strong>over the Internet</strong>. The server address is the customer's setting.</p>
</div>
<div class="band">
<p><strong><a href="https://csa-iot.org/all-solutions/matter/">Matter</a></strong> carries the same information to every device inside the house, <strong>over the home network</strong>.</p>
</div>
</div>

<h2 id="the-manufacturers-real-objection-and-the-answer">The manufacturer's real objection, and the answer</h2>
<ul>
<li><strong>What they say:</strong> the cost of the parts, and a ten-year support obligation on a device they no longer control.</li>
<li><strong>The customer already paid for the parts.</strong> Every one of these appliances ships with a microcontroller and a Wi-Fi radio, on the customer's receipt. The customer still cannot talk to the thing they bought without going through the manufacturer.</li>
<li><strong>What the closed path actually protects:</strong> the customer relationship, the customer's usage data, and a share of whatever that customer's load shifting earns.</li>
<li><strong>None of those three are theirs.</strong> The usage data is private, and it belongs to the customer. The incentive is paid for the customer's forbearance, not for the manufacturer's software. And a customer-configurable server <strong>reduces</strong> the obligation they say worries them: they stop being the mandatory operator of a cloud service for the life of the appliance.</li>
</ul>
<div class="band">
<p>The hard part was never the technology. It is that nobody is required to open the door.</p>
</div>

<h2 id="is-a-customer-configurable-server-a-security-hole-no">Is a customer-configurable server a security hole? No.</h2>
<ul>
<li><strong>It is a setting</strong>, in the same sense that choosing an email provider is a setting. The manufacturer still ships a working default. What changes is that the default is not a lock.</li>
<li><strong>The two signals have different risk profiles</strong>, and that is the whole answer. Server choice affects <strong>price</strong> response, which is economic: a wrong price costs money, not safety. It does not affect the <strong>limit</strong>, which is enforced at the connection independently of anything the customer configured.</li>
<li><strong>Today's arrangement is the larger attack surface</strong>: dozens of vendor clouds, none subject to utility-grade review, each holding the ability to operate appliances inside homes directly.</li>
</ul>
<div class="band">
<p>A price is a one-way number. A command is a key to somebody's house.</p>
</div>
