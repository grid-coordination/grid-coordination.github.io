<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 452" width="1000" height="452" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="1000" height="452" fill="#FFFFFF"/>
  <rect x="20" y="20" width="960" height="72" rx="8" fill="#EDF2EE"/>
  <text x="42" y="51" font-size="16" font-weight="600" fill="#16212E">Specifications</text>
  <text x="42" y="72" font-size="13" fill="#7A8592">OpenAPI YAML and JSON Schema</text>
  <rect x="300" y="41.0" width="219" height="30" rx="15" fill="#FFFFFF" stroke="#C6D3C9" stroke-width="1.6"/>
  <text x="410" y="61.0" font-size="14" font-weight="600" fill="#16212E" text-anchor="middle">openadr3-specification</text>
  <rect x="20" y="102" width="960" height="72" rx="8" fill="#E3EDE6"/>
  <text x="42" y="133" font-size="16" font-weight="600" fill="#16212E">Pure API libraries</text>
  <text x="42" y="154" font-size="13" fill="#7A8592">spec-driven HTTP, entity coercion</text>
  <rect x="300" y="123.0" width="90" height="30" rx="15" fill="#FFFFFF" stroke="#C6D3C9" stroke-width="1.6"/>
  <text x="345" y="143.0" font-size="14" font-weight="600" fill="#16212E" text-anchor="middle">clj-oa3</text>
  <rect x="402.2" y="123.0" width="116" height="30" rx="15" fill="#FFFFFF" stroke="#C6D3C9" stroke-width="1.6"/>
  <text x="460" y="143.0" font-size="14" font-weight="600" fill="#16212E" text-anchor="middle">python-oa3</text>
  <rect x="20" y="184" width="960" height="72" rx="8" fill="#D9E8DE"/>
  <text x="42" y="215" font-size="16" font-weight="600" fill="#16212E">Client frameworks</text>
  <text x="42" y="236" font-size="13" fill="#7A8592">lifecycle, MQTT push, discovery</text>
  <rect x="300" y="205.0" width="150" height="30" rx="15" fill="#FFFFFF" stroke="#C6D3C9" stroke-width="1.6"/>
  <text x="375" y="225.0" font-size="14" font-weight="600" fill="#16212E" text-anchor="middle">clj-oa3-client</text>
  <rect x="462.4" y="205.0" width="176" height="30" rx="15" fill="#FFFFFF" stroke="#C6D3C9" stroke-width="1.6"/>
  <text x="550" y="225.0" font-size="14" font-weight="600" fill="#16212E" text-anchor="middle">python-oa3-client</text>
  <rect x="20" y="266" width="960" height="72" rx="8" fill="#CFE2D6"/>
  <text x="42" y="297" font-size="16" font-weight="600" fill="#16212E">VTN server</text>
  <text x="42" y="318" font-size="13" fill="#7A8592">composable, embeddable</text>
  <rect x="300" y="287.0" width="125" height="30" rx="15" fill="#FFFFFF" stroke="#C6D3C9" stroke-width="1.6"/>
  <text x="362" y="307.0" font-size="14" font-weight="600" fill="#16212E" text-anchor="middle">clj-oa3-vtn</text>
  <rect x="20" y="348" width="960" height="72" rx="8" fill="#C5DDCE"/>
  <text x="42" y="379" font-size="16" font-weight="600" fill="#16212E">Applications</text>
  <text x="42" y="400" font-size="13" fill="#7A8592">and live services</text>
  <rect x="300" y="369.0" width="133" height="30" rx="15" fill="#FFFFFF" stroke="#C6D3C9" stroke-width="1.6"/>
  <text x="367" y="389.0" font-size="14" font-weight="600" fill="#16212E" text-anchor="middle">price server</text>
  <rect x="445.2" y="369.0" width="150" height="30" rx="15" fill="#FFFFFF" stroke="#D3D9DE" stroke-width="1.6"/>
  <text x="520" y="389.0" font-size="14" font-weight="600" fill="#7A8592" font-style="italic" text-anchor="middle">your code here</text>
  <text x="42" y="444" font-size="13" fill="#7A8592">Each layer builds on the one above it. Clojure and Python follow the same architecture, so teams pick the language that fits their stack.</text>
</svg>
