<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>A price server in the cloud reaching an appliance directly, with no gateway</title>
  <desc>The Grid Coordination Price Server, an OpenADR 3 VTN in the cloud, sends OpenADR 3 over the Internet straight to a Harvest heat pump inside the customer's home. The heat pump runs the OpenADR 3 client itself, so there is no gateway, no aggregator and no vendor cloud between the price and the appliance.</desc>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#2a6e3f"/></marker>
  </defs>
  <rect width="1000" height="330" fill="#FFFFFF"/>
  <text x="118" y="52" font-size="12" font-weight="600" letter-spacing="2" fill="#7A8592" text-anchor="end">CLOUD</text>
  <text x="112" y="126" font-size="12" font-weight="600" letter-spacing="2" fill="#2a6e3f" text-anchor="end">YOUR</text>
  <text x="112" y="144" font-size="12" font-weight="600" letter-spacing="2" fill="#2a6e3f" text-anchor="end">HOME</text>

  <rect x="127" y="16" width="236" height="74" rx="7" fill="#EEF0F2" stroke="#C3CAD1" stroke-width="1.8"/>
  <text x="245.0" y="40.0" font-size="15" font-weight="600" fill="#16212E" text-anchor="middle">Grid Coordination</text>
  <text x="245.0" y="58.0" font-size="15" font-weight="600" fill="#16212E" text-anchor="middle">Price Server</text>
  <text x="245.0" y="79.0" font-size="12" fill="#7A8592" text-anchor="middle">OpenADR 3 VTN</text>

  <line x1="245" y1="90" x2="245" y2="128" stroke="#2a6e3f" stroke-width="2.4" marker-end="url(#g)"/>
  <text x="258" y="108" font-size="13" font-weight="600" fill="#2a6e3f">OpenADR 3, over the Internet</text>

  <rect x="128" y="130" width="832" height="164" rx="12" fill="#f4f8f5" stroke="#2a6e3f" stroke-width="2" stroke-dasharray="8 6"/>

  <rect x="150" y="156" width="300" height="62" rx="7" fill="#FFFFFF" stroke="#2a6e3f" stroke-width="2.4"/>
  <text x="300.0" y="181.0" font-size="15" font-weight="600" fill="#16212E" text-anchor="middle">Harvest heat pump</text>
  <text x="300.0" y="201.0" font-size="12" fill="#7A8592" text-anchor="middle">OpenADR 3 VEN, in the appliance</text>

  <text x="478" y="176" font-size="13.5" fill="#2C3844">No gateway. The client is in the</text>
  <text x="478" y="196" font-size="13.5" fill="#2C3844">appliance, and it holds only a URL.</text>

  <text x="544" y="268" font-size="13" fill="#7A8592" text-anchor="middle">Nothing between the price and the appliance: no gateway, no aggregator, no vendor cloud.</text>
</svg>
